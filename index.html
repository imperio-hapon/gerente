<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel Império Hap-on</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  display: flex;
  background: #f4f6fb;
}

.menu {
  width: 250px;
  background: #1a1a2e;
  color: #fff;
  height: 100vh;
  padding: 20px 15px;
}

.menu h2 {
  font-size: 18px;
  margin-bottom: 25px;
}

.menu button {
  display: block;
  width: 100%;
  margin: 6px 0;
  padding: 12px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  background: #ffffff;
  font-weight: 600;
  transition: 0.2s;
}

.menu button:hover {
  background: #4361ee;
  color: #fff;
}

.menu button.active {
  background: #4361ee;
  color: #fff;
}

/* botões ocultos (mantidos no código para reativar se precisar) */
.menu button.oculto {
  display: none;
}

iframe {
  flex: 1;
  border: none;
  background: #fff;
}
</style>
</head>

<body>

<div class="menu">
<h2>📊 Império Hap-on</h2>

<!-- Botões ocultos: para voltar a exibir, retire a classe "oculto" -->
<button class="oculto" onclick="loadPage('vidas.html', this)">Vidas / Conversão</button>
<button class="oculto" onclick="loadPage('vendas.html', this)">Vendas</button>
<button class="oculto" onclick="loadPage('disponivel.html', this)">Disponível / 1º resposta</button>
<button class="oculto" onclick="loadPage('Diagnostico_GUP_Setembro.html', this)">Diagnóstico 1ª × 2ª quinzena</button>

<!-- Botões visíveis -->
<button onclick="loadPage('Operacional.html', this)" class="active">Operacional</button>
<button onclick="loadPage('Performance.html', this)">Performance</button>
<button onclick="loadPage('Indicadores.html', this)">Indicadores</button>

</div>

<iframe id="frame" src="Operacional.html"></iframe>

<script>
function loadPage(page, element){
  document.getElementById('frame').src = page;

  // remover ativo de todos
  document.querySelectorAll('.menu button').forEach(btn => {
    btn.classList.remove('active');
  });

  // ativar o clicado
  element.classList.add('active');
}
</script>

</body>
</html>
