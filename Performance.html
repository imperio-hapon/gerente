<style>
/* Layout: sticky brand bar + horizontal tab strip; each tab = summary KPIs → reading → chart + actions → case table → adjustments */
:root{
  --bg:#f5f7fa; --surface:#ffffff; --surface-2:#eef1f5; --ink:#1f2a3a; --ink-2:#4a5568; --muted:#6b7689;
  --line:#e2e6ec; --line-strong:#ccd3dd;
  --primary:#1539aa; --primary-ink:#1539aa; --primary-soft:#e4eafb; --bar-weak:#a9bbef; --heat:21,57,170;
  --brand-bar:#0f2f8f; --brand-ink:#ffffff; --brand-muted:#c2d0f6;
  --good:#157a3c; --good-soft:#e3f4e9; --bad:#b4232b; --bad-soft:#fde8e8; --warn:#8a5300; --warn-soft:#fff3d6;
  --accent-warm:#ff8800;
  --f-display:"Hanken Grotesk","Pitanga",system-ui,sans-serif;
  --f-body:"Inter","Segoe UI",system-ui,sans-serif;
  --f-mono:"Roboto Mono",ui-monospace,Menlo,monospace;
  --r:10px; --shadow:0 2px 10px -2px rgba(20,28,40,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e141e; --surface:#161f2d; --surface-2:#1d2838; --ink:#e7ecf4; --ink-2:#b4bfcf; --muted:#8c98ab;
  --line:#26324a; --line-strong:#34425c;
  --primary:#6d8fe8; --primary-ink:#9db4f2; --primary-soft:#1b2a52; --bar-weak:#3b4f86; --heat:109,143,232;
  --brand-bar:#0b1736; --brand-ink:#e7ecf4; --brand-muted:#8aa4ec;
  --good:#5cc98a; --good-soft:#123222; --bad:#f08a8f; --bad-soft:#3a1719; --warn:#f2bf55; --warn-soft:#33270d;
  --shadow:0 2px 10px -2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141e; --surface:#161f2d; --surface-2:#1d2838; --ink:#e7ecf4; --ink-2:#b4bfcf; --muted:#8c98ab;
  --line:#26324a; --line-strong:#34425c;
  --primary:#6d8fe8; --primary-ink:#9db4f2; --primary-soft:#1b2a52; --bar-weak:#3b4f86; --heat:109,143,232;
  --brand-bar:#0b1736; --brand-ink:#e7ecf4; --brand-muted:#8aa4ec;
  --good:#5cc98a; --good-soft:#123222; --bad:#f08a8f; --bad-soft:#3a1719; --warn:#f2bf55; --warn-soft:#33270d;
  --shadow:0 2px 10px -2px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--brand-bar);color:var(--brand-ink)}
.brand{max-width:1240px;margin:0 auto;padding:12px 24px 0;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand b{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:-.01em}
.brand span{color:var(--brand-muted);font-size:12px}
.tabs{max-width:1240px;margin:0 auto;padding:8px 24px 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.tab{appearance:none;border:0;background:transparent;color:var(--brand-muted);font:500 13px/1 var(--f-body);padding:11px 14px 13px;border-radius:8px 8px 0 0;white-space:nowrap;cursor:pointer;position:relative}
.tab:hover{color:var(--brand-ink);background:rgba(255,255,255,.07)}
.tab[aria-selected="true"]{background:var(--bg);color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--accent-warm);outline-offset:-2px}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent-warm);margin-left:6px;vertical-align:middle}
main{max-width:1240px;margin:0 auto;padding-inline:24px;padding-block:28px 64px}
.page{display:grid;gap:22px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:500;font-size:32px;line-height:1.15;margin:4px 0 6px;letter-spacing:-.02em;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--ink-2);max-width:78ch;margin:0}
.hint{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow);min-width:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:15px;font-weight:500;color:var(--ink-2)}
.kpi .t{font-family:var(--f-display);font-size:18px;font-weight:600;line-height:1.2;margin-top:6px}
.kpi .d{color:var(--ink-2);font-size:12.5px;margin-top:4px}
.resumo{background:var(--primary-soft);border-radius:var(--r);padding:18px 22px;display:grid;gap:6px}
.resumo p{margin:0;font-size:15.5px;line-height:1.55;max-width:95ch}
.resumo .eyebrow{color:var(--primary-ink)}
.two{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
/* bars */
.bars{display:grid;gap:14px}
.bar-row{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr) 92px;gap:14px;align-items:center}
.bar-row .lbl b{display:block;font-weight:600;font-size:13.5px}
.bar-row .lbl > span{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.track{position:relative;height:22px;background:var(--surface-2);border-radius:4px}
.fill{position:absolute;inset:0 auto 0 0;background:var(--primary);border-radius:4px}
.fill.ctx{background:var(--bar-weak)}
.fill.top{background:var(--primary)}
.ghost{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink-2);opacity:.75}
.val{text-align:right;font-variant-numeric:tabular-nums}
.val b{font-size:15px;font-family:var(--f-display)}
.val span{display:block;color:var(--muted);font-size:11.5px}
.tag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);margin-left:6px;vertical-align:1px}
.legend-note{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:14px}
.legend-note i{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
/* actions */
ol.acoes{margin:0;padding:0;list-style:none;counter-reset:a;display:grid;gap:10px}
ol.acoes li{counter-increment:a;display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start}
ol.acoes li::before{content:counter(a);width:24px;height:24px;border-radius:50%;background:var(--primary-soft);color:var(--primary-ink);font:600 12px/24px var(--f-body);text-align:center}
/* table */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
th.c,td.c{text-align:center}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr.main{cursor:pointer}
tbody tr.main:hover td{background:var(--surface-2)}
tbody tr.main:focus-visible td{outline:2px solid var(--primary);outline-offset:-2px}
tr.excl td{color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
.yes{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--bad)}
.no{display:inline-block;width:10px;height:2px;background:var(--line-strong);vertical-align:middle}
tr.excl .yes{background:var(--line-strong)}
.chip{display:inline-block;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip.perda{background:var(--bad-soft);color:var(--bad)}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.ex{background:var(--surface-2);color:var(--muted)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.flag{display:inline-block;font-size:10.5px;color:var(--warn);background:var(--warn-soft);padding:1px 6px;border-radius:4px;margin-left:6px}
tr.det td{background:var(--surface-2);padding:12px 14px 14px;color:var(--ink-2)}
tr.det p{margin:0 0 4px;max-width:110ch}
tr.det b{color:var(--ink)}
.caret{display:inline-block;transition:transform .16s;color:var(--muted);margin-right:6px}
tr.open .caret{transform:rotate(90deg)}
/* cases */
.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.case{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--surface);display:grid;gap:6px;align-content:start}
.case .h{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.case p{margin:0;color:var(--ink-2);font-size:13px}
.case .who{font-weight:600;font-size:13.5px}
/* adjust */
.ajustes{border:1px dashed var(--line-strong);border-radius:var(--r);padding:16px 20px;background:transparent}
.ajustes ul{margin:8px 0 0;padding-left:18px;display:grid;gap:6px;color:var(--ink-2)}
.ajustes li{max-width:110ch}
/* heat */
.heat td.h{text-align:center;font-variant-numeric:tabular-nums;font-weight:500;min-width:76px}
.heat td.fila{font-weight:600;white-space:nowrap}
.heat tr.click{cursor:pointer}
.heat tr.click:hover td.fila{color:var(--primary-ink);text-decoration:underline}
/* compare */
.cmp{display:grid;gap:14px}
.cmp-row{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr) 84px;gap:14px;align-items:center}
.cmp-bars{display:grid;gap:4px}
.cmp-bars .track{height:13px}
.delta{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;font-size:13px}
.delta.up{color:var(--bad)} .delta.down{color:var(--good)} .delta.na{color:var(--muted);font-weight:400}
.stack{display:flex;height:34px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surface)}
.stack div{display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;color:#fff;min-width:0}
.gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.gloss div{border-left:0;background:var(--surface-2);border-radius:8px;padding:12px 14px}
.gloss b{display:block;font-size:13.5px;margin-bottom:2px}
.gloss span{color:var(--ink-2);font-size:12.5px}
.foot{color:var(--muted);font-size:12px;max-width:100ch}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){
  main{padding-inline:16px}.brand,.tabs{padding-inline:16px}
  h1{font-size:25px}.kpi .v{font-size:23px}
  .bar-row,.cmp-row{grid-template-columns:minmax(0,1fr) 78px}
  .bar-row .lbl,.cmp-row .lbl{grid-column:1 / -1}
  .card{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function kpis(t){
  const f=t.funil, n=f[0].n;
  const k=(lbl,v,d)=>`<div class="kpi"><div class="eyebrow">${lbl}</div><div class="v">${v}</div><div class="d">${d}</div></div>`;
  return `<div class="kpis">
    ${k(t.total?'Atendimentos analisados':f[0].l, t.total? `${t.total}` : n, t.total? `${n} com caso detalhado` : t.id==='eugenia'?`${t.semperfil} sem perfil comercial`:'monitorados nesta rodada')}
    ${k(f[1].l, `${f[1].n} <small>de ${n}</small>`, `${pct(f[1].n/n)} ${t.id==='carrinho'?'dos casos':'da amostra'}`)}
    ${k(f[2].l, `${f[2].n} <small>de ${f[1].n}</small>`, f[2].n? `dos interessados` : 'nenhum interessado chegou à proposta')}
    ${k(f[3].l, f[3].n, f[3].n? 'vendas confirmadas' : `<span class="drop">${f[1].n} interessados sem venda</span>`)}
  </div>`;
}
function funnel(t){
  const n=t.funil[0].n;
  const rows=t.funil.map((s,i)=>{const prev=i?t.funil[i-1].n:null;const w=s.n/n*100;
    return `<div class="f-row"><div class="l">${esc(s.l)}</div><div class="track"><div class="fill ${s.n?'':'zero'}" style="width:${w}%">${s.n&&w>8?s.n:''}</div></div>
    <div class="val"><b>${s.n}</b>${i&&prev-s.n>0?`<span class="drop">−${prev-s.n}</span> na etapa`:i?'sem perda':''}</div></div>`}).join('');
  let org='';
  if(t.origem){
    const tot=t.origem.reduce((a,o)=>a+o.n,0);
    const nm={vend:'Depende do vendedor',misto:'Produto e condução',audit:'Encerrado sem contato humano',ext:'Fora do controle do vendedor'};
    org=`<h2 style="margin-top:22px">${t.id==='eugenia'?'Perfil dos clientes atendidos':'Por que a venda não aconteceu'}</h2><p class="hint">Origem da perda em cada ${t.id==='eugenia'?'cliente':'atendimento'}. Azul depende da condução comercial; cinza é base, fila ou demanda sem intenção de compra.</p>
    <div class="stack">${t.origem.map(o=>`<div class="t-${o.t}" style="flex:${o.n}" title="${esc(o.l)}: ${o.n}">${o.n}</div>`).join('')}</div>
    <div class="legend-note" style="margin-top:12px">${t.origem.map(o=>`<span><i class="t-${o.t}" style="background:${{vend:'var(--primary)',misto:'#5378dd',audit:'#c93600',ext:'#79859a'}[o.t]}"></i>${esc(o.l)}: <b style="color:var(--ink)">${o.n}</b> (${pct(o.n/tot)})</span>`).join('')}</div>`;
  } else if(t.id==='carrinho'){
    org=`<h2 style="margin-top:22px">Tempo de resposta</h2><p class="hint">No Carrinho o cliente está online por pouco tempo. A demora pesa mais aqui do que em qualquer outra fila.</p>
    <div class="stack"><div class="t-audit" style="flex:${t.sla}">${t.sla} chats com SLA estourado</div><div class="t-ext" style="flex:${t.total-t.sla}">${t.total-t.sla}</div></div>
    <p style="margin:12px 0 0;color:var(--ink-2)">Exemplos: Pamella esperou 47 min e depois mais 4 h; Jenni esperou 1h20 e foi chamada pelo nome errado; Milly esperou 4h30 pelo segundo contato.</p>`;
  }
  return `<div class="card"><h2>Do interesse à venda</h2><p class="hint">Quantos ${UN[t.unid]==='vendedores'?'clientes':UN[t.unid]} passaram por cada etapa e onde a negociação parou.</p><div class="funnel">${rows}</div>${org}</div>`;
}
function ofensores(t){
  const real=t.ofensores.filter(o=>!o.semid||o.n), sem=t.ofensores.filter(o=>o.semid&&!o.n);
  const unit = t.unid==='colaboradores'?'vendedores':'atendimentos';
  return `<div class="card"><h2>Principais ofensores</h2><p class="hint">${t.unid==='colaboradores'?'Em quantos dos 5 vendedores o problema apareceu.':`Em quantos ${unit} o problema apareceu. Um atendimento pode ter mais de um.`} Comercial pede treinamento; operacional pede ajuste de processo.</p>
  <div class="bars">${real.map(o=>`<div class="bar-row" title="${esc(o.ids)}">
    <div class="lbl"><b>${esc(o.nome)}<span class="grp ${o.grupo}">${o.grupo}</span></b><span>${esc(o.diag)}</span></div>
    <div class="track"><div class="fill ${o.grupo}" style="width:${o.n/o.den*100}%"></div></div>
    <div class="val"><b>${o.n} de ${o.den}</b><span>${pct(o.n/o.den)}</span></div></div>`).join('')}</div>
  ${sem.length?`<p class="semid" style="margin:14px 0 0">Citado na análise sem caso identificado: ${sem.map(o=>esc(o.nome)).join(', ')}.</p>`:''}</div>`;
}
function plano(t){
  return `<div class="card"><h2>O que fazer agora</h2><p class="hint">Plano de ação em ordem de prioridade.</p><ol class="acoes">${t.plano.map(p=>`<li><div><b>${esc(p.acao)}</b><div style="color:var(--ink-2);font-size:13px">${esc(p.foco)}</div><div style="color:var(--muted);font-size:12px;margin-top:2px">Para: ${esc(p.quem)}</div></div></li>`).join('')}</ol></div>`;
}
function casos(t){
  const crit=t.rows.filter(r=>r.prio==='Crítica').slice(0,t.id==='eugenia'?6:4);
  if(!crit.length) return '';
  return `<div><h2>Casos para usar no feedback</h2><p class="hint">${t.id==='eugenia'?'Clientes com intenção clara de compra que não foram convertidos.':'Atendimentos de prioridade crítica: o cliente queria comprar e a venda se perdeu na condução.'}</p>
  <div class="cases">${crit.map(r=>`<div class="case"><div class="h"><span class="mono">${esc(r.id)}</span><span class="prio Crítica">${esc(r.etapa)}</span></div>
    <div class="who">${esc(r.colab)}${r.cliente?` · <span style="font-weight:400;color:var(--muted)">${esc(r.cliente)}</span>`:''}</div>
    ${r.frase?`<p class="quote">${esc(r.frase)}</p>`:''}
    <p>${esc(r.aconteceu)}</p>
    <div class="lbl2">O que deveria ter acontecido</div><p style="color:var(--ink)">${esc(r.deveria)}</p></div>`).join('')}</div></div>`;
}
const yn=v=> v===null||v===undefined?'<span class="yn n">—</span>': v?'<span class="yn s">Sim</span>':'<span class="yn n">Não</span>';
function table(t){
  if(t.id==='eugenia') return '';
  const idl=t.idlabel||'ID';
  return `<div class="card"><h2>${t.id==='carrinho'?'Caso a caso':'Atendimento a atendimento'}</h2><p class="hint">Clique em uma linha para ver o que aconteceu e o que deveria ter acontecido.</p>
  <div class="tbl-wrap"><table><thead><tr><th>${idl}</th><th>${t.id==='carrinho'?'Consultor':'Colaborador'}</th><th>Etapa da perda</th><th class="c">Intenção</th><th class="c">${t.id==='carrinho'?'Valores':'Proposta'}</th><th>Ofensor</th><th>Prioridade</th></tr></thead><tbody>
  ${t.rows.map(r=>`<tr class="main" tabindex="0" aria-expanded="false"><td class="${t.id==='carrinho'?'':'mono'}"><span class="caret">›</span>${esc(r.id)}</td><td>${esc(r.colab)}</td><td>${esc(r.etapa)}</td><td class="c">${yn(r.int)}</td><td class="c">${r.propna?'<span class="yn n">Não registrado</span>':yn(r.prop)}</td><td>${esc(r.ofensor)}</td><td><span class="prio ${esc(r.prio)}">${esc(r.prio)}</span></td></tr>
  <tr class="det" hidden><td colspan="7">${r.cliente?`<p><b>Cliente:</b> ${esc(r.cliente)}${r.origem?` · <b>Origem da perda:</b> ${esc(r.origem)}`:''}</p>`:''}${r.frase?`<p><b>Frase do cliente:</b> “${esc(r.frase)}”</p>`:''}<p><b>O que aconteceu:</b> ${esc(r.aconteceu)}</p>${r.causa?`<p><b>Causa:</b> ${esc(r.causa)}</p>`:''}<p><b>O que deveria ter acontecido:</b> ${esc(r.deveria)}</p></td></tr>`).join('')}
  </tbody></table></div></div>`;
}
function colabs(t){
  const num = t.colabs.some(c=>c.atend!==''); const pos = t.colabs.some(c=>c.positivo);
  return `<div class="card"><h2>Por ${t.id==='carrinho'?'consultor':'colaborador'}</h2><p class="hint">Não é ranking: a quantidade e o tipo de atendimento variam entre as pessoas.</p>
  <div class="tbl-wrap"><table><thead><tr><th>Nome</th>${num?`<th class="c">${t.id==='eugenia'?'Clientes':'Atend.'}</th><th class="c">Interesse</th><th class="c">${t.id==='eugenia'?'Avançadas':'Proposta'}</th><th class="c">Vendas</th>`:'<th>Casos</th>'}<th>Onde precisa melhorar</th>${pos?'<th>Ponto positivo</th>':''}<th>Prioridade</th></tr></thead><tbody>
  ${t.colabs.map(c=>`<tr><td class="fila" style="font-weight:600;white-space:nowrap">${esc(c.nome)}</td>${num?`<td class="c mono">${c.atend}</td><td class="c mono">${c.int}</td><td class="c mono">${c.prop}</td><td class="c mono">${c.vendas}</td>`:`<td>${esc(c.casos)}</td>`}<td class="wrap">${esc(c.ofensor)}${c.etapa&&c.etapa!=='—'?`<div style="color:var(--muted);font-size:12px">Etapa: ${esc(c.etapa)}</div>`:''}</td>${pos?`<td class="wrap" style="color:var(--ink-2)">${esc(c.positivo)||'—'}</td>`:''}<td><span class="prio ${esc(c.prio)}">${esc(c.prio)}</span></td></tr>`).join('')}
  </tbody></table></div></div>`;
}
function fatores(t){
  return `<div class="card"><h2>Fora do controle do vendedor</h2><p class="hint">Perdas de processo, base ou sistema. Precisam de outro responsável para serem resolvidas.</p>
  <div class="fat">${t.fatores.map(f=>`<div><b>${esc(f.fator)}</b><span>${esc(f.evid)}</span><em>Responsável: ${esc(f.resp)}</em></div>`).join('')}</div></div>`;
}
function tabPage(t){
  return `<section class="page">
    <div><div class="eyebrow">Fila analisada · ${esc(t.periodo)}</div><h1>${esc(t.titulo)}</h1><p class="sub">${esc(t.escopo)}</p></div>
    ${kpis(t)}
    <div class="resumo"><div class="eyebrow">Causa raiz</div><p>${esc(t.resumo)}</p></div>
    <div class="two">${ofensores(t)}${plano(t)}</div>
    ${funnel(t)}
    ${casos(t)}
    ${table(t)}
    ${colabs(t)}
    ${fatores(t)}
    <p class="foot">Atenção na leitura: ${esc(t.nota)}</p>
  </section>`;
}
function overview(){
  const sum=i=>TABS.reduce((a,t)=>a+t.funil[i].n,0);
  const an=sum(0), it=sum(1), pr=sum(2), vd=sum(3);
  const comFech = TABS.filter(t=>t.tema[0]&&t.tema[0].n).length;
  return `<section class="page">
    <div><div class="eyebrow">Visão geral · 7 filas · outubro/2026</div><h1>Por que o cliente interessado não compra?</h1><p class="sub">Consolidado das análises de causa raiz de cada fila. Cada aba acima traz os casos, os colaboradores e o plano de ação da fila.</p></div>
    <div class="kpis">
      <div class="kpi"><div class="eyebrow">Clientes com caso detalhado</div><div class="v">${an}</div><div class="d">nas 7 filas analisadas</div></div>
      <div class="kpi"><div class="eyebrow">Com intenção de compra</div><div class="v">${it} <small>de ${an}</small></div><div class="d">${pct(it/an)} chegaram querendo comprar</div></div>
      <div class="kpi"><div class="eyebrow">Receberam proposta ou valores</div><div class="v">${pr} <small>de ${it}</small></div><div class="d">${pct(pr/it)} dos interessados</div></div>
      <div class="kpi"><div class="eyebrow">Vendas confirmadas</div><div class="v">${vd}</div><div class="d"><span class="drop">${it} interessados sem venda</span></div></div>
    </div>
    <div class="resumo"><div class="eyebrow">Em resumo</div><p>O problema não é falta de interesse: ${pct(it/an)} dos clientes queriam comprar. A venda se perde depois, quando o cliente diz "vamos seguir" ou recebe o preço. Falta conduzir ao fechamento (aparece em ${comFech} das 7 filas), negociar a objeção de preço e responder rápido. Parte da perda vem de fora da negociação: leads sem perfil, demandas administrativas e fila noturna.</p></div>
    <div class="card"><h2>Mapa de ofensores por fila</h2><p class="hint">Em quantos casos de cada fila o problema apareceu. Cor mais forte = mais frequente. Na Eugênia a contagem é por vendedor (de 5). Clique em uma fila para abrir a aba.</p>
      <div class="tbl-wrap"><table class="heat"><thead><tr><th>Fila</th>${THEMES.map(h=>`<th class="c">${esc(h)}</th>`).join('')}</tr></thead><tbody>
      ${TABS.map(t=>`<tr class="click" data-go="${t.id}" tabindex="0"><td class="fila">${esc(t.nome)}</td>${t.tema.map(c=>!c?'<td class="h c" style="color:var(--muted)">·</td>':c.semid?'<td class="h c semid" title="Citado sem caso identificado">citado</td>':heatCell(c.n/c.den,`${c.n}/${c.den}`)).join('')}</tr>`).join('')}
      </tbody></table></div>
      <div class="legend-note"><span>“·” não apontado na análise</span><span>“citado” mencionado sem caso identificado</span></div></div>
    <div class="card"><h2>Fila a fila</h2><p class="hint">Do interesse à venda em cada fila, com a causa principal.</p>
      <div class="tbl-wrap"><table><thead><tr><th>Fila</th><th class="c">Casos</th><th class="c">Interesse</th><th class="c">Proposta</th><th class="c">Vendas</th><th>Causa principal</th></tr></thead><tbody>
      ${TABS.map(t=>`<tr class="main-go" data-go="${t.id}" tabindex="0" style="cursor:pointer"><td class="fila" style="font-weight:600;white-space:nowrap">${esc(t.nome)}</td><td class="c mono">${t.funil[0].n}</td><td class="c mono">${t.funil[1].n}</td><td class="c mono">${t.funil[2].n}</td><td class="c mono">${t.funil[3].n}</td><td>${esc(t.curta)}</td></tr>`).join('')}
      </tbody></table></div></div>
    <div class="two">
      <div class="card"><h2>O que vale para todas as filas</h2><ol class="acoes">
        <li>A cada "sim" ou "vamos seguir", pedir os dados e enviar a proposta na mesma conversa.</li>
        <li>Na objeção de preço, perguntar quanto cabe no orçamento e oferecer uma alternativa.</li>
        <li>Ler o histórico antes de responder: não repetir o que o cliente já disse ao bot ou a outro vendedor.</li>
        <li>Investigar o motivo da compra (SPIN), não só idade e cidade.</li>
        <li>Follow-up retoma a dúvida que travou a decisão, com data combinada.</li>
        <li>Responder dentro do SLA, principalmente quem acabou de demonstrar interesse.</li></ol></div>
      <div class="card"><h2>Fora do controle do vendedor</h2><ol class="acoes">
        <li><div><b>Base com leads sem perfil</b><div style="color:var(--ink-2);font-size:13px">Demandas de SAC, contatos inválidos e sem condição de pagar em PME, Repique, Cancelados, Adesão e Eugênia.</div></div></li>
        <li><div><b>Fila e escala</b><div style="color:var(--ink-2);font-size:13px">Leads da noite atribuídos só na manhã seguinte (Adesão, Eugênia, PME) e redistribuição em massa no Carrinho.</div></div></li>
        <li><div><b>Sessões encerradas sem contato humano</b><div style="color:var(--ink-2);font-size:13px">Clientes que responderam "SIM, VAMOS SEGUIR" no Repique. Auditar.</div></div></li>
        <li><div><b>Áudios não transcritos</b><div style="color:var(--ink-2);font-size:13px">Em todas as filas parte da negociação não pode ser auditada.</div></div></li></ol></div>
    </div>
    <p class="foot">Amostras qualitativas e pequenas (7 a 20 casos por fila). Conecta, PME e Carrinho misturam sessões de outras filas. Use os números como sinal para orientar coaching, não como taxa de conversão da operação.</p>
  </section>`;
}
const ALL=[{id:'geral',nome:'Visão geral'},...TABS];
const nav=document.getElementById('tabs'), main=document.getElementById('main');
nav.innerHTML=ALL.map(t=>`<button class="tab" role="tab" id="tab-${t.id}" data-id="${t.id}" aria-selected="false">${esc(t.nome)}</button>`).join('');
function show(id,push){
  if(!ALL.find(t=>t.id===id)) id='geral';
  nav.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.id===id));
  main.innerHTML=id==='geral'?overview():tabPage(TABS.find(t=>t.id===id));
  if(push){try{history.replaceState(null,'','#'+id)}catch(e){} try{localStorage.setItem('cr-tab',id)}catch(e){} window.scrollTo({top:0})}
  const b=document.getElementById('tab-'+id); b&&b.scrollIntoView({block:'nearest',inline:'nearest'});
}
nav.addEventListener('click',e=>{const b=e.target.closest('.tab'); if(b) show(b.dataset.id,true)});
nav.addEventListener('keydown',e=>{if(!['ArrowRight','ArrowLeft'].includes(e.key))return;const bs=[...nav.querySelectorAll('.tab')];const i=bs.indexOf(document.activeElement);if(i<0)return;const n=bs[(i+(e.key==='ArrowRight'?1:-1)+bs.length)%bs.length];n.focus();show(n.dataset.id,true)});
main.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){show(g.dataset.go,true);return}
  const tr=e.target.closest('tr.main');if(tr){const d=tr.nextElementSibling;d.hidden=!d.hidden;tr.classList.toggle('open',!d.hidden);tr.setAttribute('aria-expanded',!d.hidden)}});
main.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const t=e.target.closest('tr.main,[data-go]');if(t){e.preventDefault();t.click()}});
let start=(location.hash||'').slice(1); if(!start){try{start=localStorage.getItem('cr-tab')||''}catch(e){}}
show(start||'geral',false);
</script>

</body>
</html>
