<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitorias Comerciais</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F3F6F9;--surface:#FFFFFF;--ink:#15212D;--ink2:#3B4A59;--muted:#5A6A7A;--line:#DAE2EA;--head:#EAF0F5;
  --accent:#1F5FA8;--accent-2:#7FA6D6;--accent-3:#C9D9EE;--neutral-bar:#9AA8B6;
  --s1:#EAF1FA;--s2:#C9DAF0;--s3:#8FB2E0;--s4:#4F84C7;--s5:#1F5FA8;
  --ok:#1E7F4F;--ok-bg:#E2F3EA;--warn:#9A6200;--warn-bg:#FBF0DA;--bad:#B3261E;--bad-bg:#FBE4E2;--info:#1F5FA8;--info-bg:#E2ECF8;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0E151C;--surface:#16202A;--ink:#E4EBF2;--ink2:#C2CEDA;--muted:#95A5B5;--line:#283645;--head:#1C2834;
  --accent:#78AEEA;--accent-2:#4A78AE;--accent-3:#2A4466;--neutral-bar:#6B7A89;
  --s1:#1A2838;--s2:#22406A;--s3:#2F5E99;--s4:#4F86C9;--s5:#8DBBF0;
  --ok:#6FD19D;--ok-bg:#16362A;--warn:#F0BE62;--warn-bg:#3A2E14;--bad:#F2908A;--bad-bg:#3D1D1C;--info:#8DBBF0;--info-bg:#1A2E47;}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0E151C;--surface:#16202A;--ink:#E4EBF2;--ink2:#C2CEDA;--muted:#95A5B5;--line:#283645;--head:#1C2834;
  --accent:#78AEEA;--accent-2:#4A78AE;--accent-3:#2A4466;--neutral-bar:#6B7A89;
  --s1:#1A2838;--s2:#22406A;--s3:#2F5E99;--s4:#4F86C9;--s5:#8DBBF0;
  --ok:#6FD19D;--ok-bg:#16362A;--warn:#F0BE62;--warn-bg:#3A2E14;--bad:#F2908A;--bad-bg:#3D1D1C;--info:#8DBBF0;--info-bg:#1A2E47;}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1160px;margin:0 auto;padding-inline:20px;padding-block:28px 56px;display:flex;flex-direction:column;gap:24px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{margin:4px 0 0;font-size:26px;line-height:1.2;font-weight:700;text-wrap:balance}
h2{margin:0;font-size:16px;font-weight:600}
h3{margin:0;font-size:14px;font-weight:600}
p{margin:0}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x proximity;border-bottom:1px solid var(--line)}
.tab{all:unset;cursor:pointer;scroll-snap-align:start;flex:0 0 auto;display:flex;flex-direction:column;gap:2px;padding:10px 14px 12px;border-bottom:3px solid transparent;margin-bottom:-1px;min-width:120px}
.tab b{font-size:14px;font-weight:600;color:var(--ink2)}
.tab span{font-size:12px;color:var(--muted)}
.tab:hover b{color:var(--ink)}
.tab[aria-selected="true"]{border-bottom-color:var(--accent)}
.tab[aria-selected="true"] b{color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}
.panel{display:flex;flex-direction:column;gap:24px}
.phead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi b{font:500 28px/1.1 "IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.kpi b.txt{font:600 17px/1.3 "IBM Plex Sans",sans-serif}
.kpi .sub{font-size:12px;color:var(--muted)}
.kpi.hl{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.chead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.note{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:20px}
/* bars */
.bars{display:flex;flex-direction:column;gap:12px}
.brow{display:grid;grid-template-columns:minmax(140px,240px) 1fr 104px;gap:12px;align-items:center}
.brow .name{font-size:13px;color:var(--ink2);display:flex;flex-direction:column;gap:2px}
.brow .name small{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.track{position:relative;height:18px;background:var(--head);border-radius:4px}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;min-width:2px}
.brow .val{font:500 13px "IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;text-align:right;color:var(--ink)}
.brow .val span{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:10px;border-radius:2px;display:inline-block}
/* matrix */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{background:var(--head);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:center;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.mx td.c{text-align:center;padding:4px}
.cell{display:block;border-radius:4px;padding:6px 0;font:500 12px "IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;min-width:52px}
.c0{background:transparent;color:var(--line)}
.cl1{background:var(--s1);color:var(--ink)}.cl2{background:var(--s2);color:var(--ink)}.cl3{background:var(--s3);color:#0B1A2B}.cl4{background:var(--s4);color:#fff}.cl5{background:var(--s5);color:#fff}
:root[data-theme="dark"] .cl5,:root[data-theme="dark"] .cl4{color:#0B1A2B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cl5,:root:not([data-theme="light"]) .cl4{color:#0B1A2B}}
.scale{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.scale i{width:22px;height:10px;border-radius:2px;display:inline-block}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.dot.no{background:transparent;border:1.5px solid var(--line)}
td.obs{min-width:280px;max-width:520px;color:var(--ink2);font-size:12.5px}
td.id,.mono{font-family:"IBM Plex Mono",monospace;font-size:12.5px;white-space:nowrap}
/* evidence */
.evs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.ev{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.ev .top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.ev .who{font-weight:600}
.ev p{font-size:13px;color:var(--ink2)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-ok{color:var(--ok);background:var(--ok-bg)}.p-bad{color:var(--bad);background:var(--bad-bg)}.p-info{color:var(--info);background:var(--info-bg)}.p-warn{color:var(--warn);background:var(--warn-bg)}
.opp{background:var(--info-bg);border:1px solid var(--accent-3);border-radius:10px;padding:14px 18px;display:flex;flex-direction:column;gap:6px}
.opp .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.opp p{font-size:14.5px;line-height:1.55;max-width:80ch}
.read{display:flex;flex-direction:column;gap:10px;max-width:82ch}
.read p{color:var(--ink2)}
details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13px;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
details[open] summary{margin-bottom:10px}
#tip{position:fixed;pointer-events:none;z-index:10;background:var(--ink);color:var(--surface);font-size:12px;line-height:1.4;padding:7px 10px;border-radius:6px;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.hit{cursor:default}
@media (max-width:560px){.brow{grid-template-columns:1fr 64px}.brow .name{grid-column:1/-1}}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .35s ease}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">Monitorias comerciais · amostras recuperadas até 28/09/2026</div>
    <h1>Diagnóstico gerencial das monitorias</h1>
  </header>
  <nav class="tabs" role="tablist" aria-label="Filas monitoradas" id="tabs"></nav>
  <main id="panel" class="panel" role="tabpanel"></main>
</div>
<div id="tip" hidden></div>

<script>
const DATA=[{"key": "eugenia", "short": "Eugênia", "long": "Eugênia · Cotação · Seller", "title": "EUGÊNIA | EUGÊNIA COTAÇÃO | EUGÊNIA SELLER — DIAGNÓSTICO GERENCIAL", "pauta": null, "rows": [{"id": "732707095", "fila": "Eugênia Cotação", "colab": "Kamila Oliveira", "obj": true, "sla": true, "cot": true, "fup": true, "apr": true, "obs": "Cliente pediu plano nacional e já havia informado CNPJ/MEI e perfil de viagem. Na retomada, voltou-se a perguntar CNPJ/idades e o follow-up posterior ficou genérico, mesmo após o cliente reforçar que precisava de cobertura nacional."}, {"id": "731868771", "fila": "Eugênia Seller", "colab": "Kamila Oliveira", "obj": false, "sla": true, "cot": true, "fup": true, "apr": false, "obs": "Foram apresentadas duas opções e a escolha ficou com o cliente. A explicação trouxe diferença de coparticipação, mas a retomada posterior foi genérica ('não deixa para depois'), sem trabalhar a última dúvida/critério de decisão."}, {"id": "735194305", "fila": "Eugênia Cotação", "colab": "Maria Eduarda", "obj": false, "sla": false, "cot": true, "fup": false, "apr": false, "obs": "Cotação familiar iniciada pelo bot com várias opções; evidência recuperada sustenta apresentação de alternativas, sem recomendação humana específica nesta sessão."}, {"id": "735230468", "fila": "Eugênia Cotação", "colab": "Maria Eduarda", "obj": true, "sla": true, "cot": false, "fup": true, "apr": true, "obs": "Cliente já havia visto opções e chegou a dizer que não tinha mais interesse. Maria investigou o motivo (preço, cobertura, rede, carência), mas os follow-ups seguintes voltaram a mensagens genéricas de continuidade/carência zero."}, {"id": "734097771", "fila": "Eugênia", "colab": "Mirella Pereira", "obj": true, "sla": true, "cot": true, "fup": false, "apr": true, "obs": "Primeira oferta foi restrita; o cliente precisou perguntar se era a mais barata e se havia outros planos. Só depois foi investigado que queria apenas consultas e então surgiu o ambulatorial. O follow-up posterior foi mais direcionado ao valor."}, {"id": "733715356", "fila": "Eugênia Seller", "colab": "Miriam Ferreira", "obj": true, "sla": false, "cot": true, "fup": true, "apr": true, "obs": "Cliente já havia informado que tinha Hapvida e queria reduzir o valor. Ao assumir, Miriam perguntou se a simulação era para plano novo e direcionou ao SAC, sem aproveitar adequadamente o histórico comercial construído pelo bot."}, {"id": "733824882", "fila": "Eugênia Seller", "colab": "Miriam Ferreira", "obj": false, "sla": false, "cot": false, "fup": false, "apr": true, "obs": "Continuação do caso Stefany: evidência vinculada ao histórico de cliente Hapvida buscando redução de valor; oportunidade de continuidade sem reiniciar a jornada."}, {"id": "731950714", "fila": "Eugênia Seller", "colab": "Carina Siena", "obj": true, "sla": false, "cot": false, "fup": false, "apr": false, "obs": "Contraponto: o bot recomenda plano completo para cliente de 64 anos e, diante da preocupação com orçamento, apresenta alternativa ambulatorial explicando a limitação. Há recomendação contextualizada."}, {"id": "733072620", "fila": "Eugênia Seller", "colab": "Carina Siena", "obj": true, "sla": false, "cot": false, "fup": false, "apr": false, "obs": "Cliente buscava ressonância cardíaca. A jornada recomenda o plano completo por cobertura de alta complexidade, relacionando produto à necessidade declarada."}, {"id": "733130072", "fila": "Eugênia Seller", "colab": "Carina Siena", "obj": false, "sla": false, "cot": false, "fup": false, "apr": false, "obs": "Continuação do atendimento 733072620; sem evidência forte adicional de ofensor comercial nos trechos recuperados."}, {"id": "730947212", "fila": "Eugênia Seller", "colab": "Carolina Ribeiro", "obj": true, "sla": true, "cot": false, "fup": false, "apr": false, "obs": "Cliente estava em etapa de pagamento e apresentou erro no cartão. Houve condução até ativação, com ocorrências de SLA durante a jornada; usado como contraponto de persistência no fechamento."}, {"id": "735156907", "fila": "Eugênia", "colab": "Jady Queiroz", "obj": true, "sla": true, "cot": true, "fup": true, "apr": true, "obs": "Cliente informou que só poderia pagar em dia útil. A retomada posterior foi genérica e, quando voltou, Jady perguntou novamente em qual opção seguir, apesar de o cliente já ter indicado a opção que fazia mais sentido."}, {"id": "732029131", "fila": "Eugênia Cotação", "colab": "Jady Queiroz", "obj": true, "sla": true, "cot": true, "fup": true, "apr": true, "obs": "Cliente ainda não havia escolhido. A abordagem foi feita às 22h32 perguntando diretamente em qual opção seguir; o cliente reagiu negativamente. Faltou entender o motivo da não escolha e retomar a barreira real."}, {"id": "730917090", "fila": "Eugênia", "colab": "Rogério Stivanello", "obj": false, "sla": true, "cot": true, "fup": false, "apr": false, "obs": "Após cidade, idade e quantidade de vidas, foram apresentados valores e diferenças de coparticipação. A evidência recuperada mostra cotação, mas pouca recomendação baseada no perfil."}, {"id": "729561716", "fila": "Eugênia Seller", "colab": "Rogério Stivanello", "obj": false, "sla": true, "cot": false, "fup": false, "apr": false, "obs": "Cliente já estava em fechamento e enviou documentação. Apesar de vários SLAs, houve continuidade até pagamento/boas-vindas; contraponto de condução ao fechamento."}, {"id": "731085457", "fila": "Eugênia", "colab": "Sofia Lunga", "obj": false, "sla": false, "cot": true, "fup": true, "apr": true, "obs": "Atendimento de Eugênia recuperado no mesmo bloco; classificado conservadoramente como oportunidade de recomendação/continuidade a partir do histórico já existente."}, {"id": "731004390", "fila": "Eugênia Seller", "colab": "Sofia Lunga", "obj": false, "sla": true, "cot": false, "fup": false, "apr": false, "obs": "Contraponto positivo de follow-up: Sofia retomou repetidamente a pendência real de pagamento, perguntou sobre dificuldade e alertou sobre expiração da proposta."}, {"id": "734063770", "fila": "Eugênia Seller", "colab": "Raiane Lima", "obj": true, "sla": true, "cot": false, "fup": false, "apr": true, "obs": "Cliente chegou transferido porque o link de pagamento travava. A primeira pergunta humana foi se queria seguir com a adesão, apesar de o histórico mostrar contratação já concluída e problema específico no pagamento."}, {"id": "732082685", "fila": "Eugênia", "colab": "Thaisa Almeida", "obj": false, "sla": false, "cot": true, "fup": true, "apr": true, "obs": "Atendimento recuperado no bloco de Eugênia; oportunidade concentrada em usar o contexto já coletado e avançar para recomendação/follow-up específico."}, {"id": "731202822", "fila": "Eugênia Seller", "colab": "Thaisa Almeida", "obj": false, "sla": false, "cot": true, "fup": true, "apr": true, "obs": "Bot já havia apresentado três opções. Ao assumir, a promotora enviou lista de documentos e pediu 'valor do plano escolhido', sem antes confirmar/recomendar qual produto atendia melhor; follow-ups posteriores foram genéricos."}, {"id": "732709243", "fila": "Eugênia Cotação", "colab": "Unildo Ferreira Gois Junior", "obj": false, "sla": true, "cot": false, "fup": true, "apr": true, "obs": "Bot transferiu após simulações. Unildo retomou apenas com 'ficou alguma dúvida?' e 'deseja prosseguir?', sem usar detalhes das opções/necessidade para construir uma retomada específica."}, {"id": "735162492", "fila": "Eugênia Cotação", "colab": "Thais Santos", "obj": false, "sla": true, "cot": false, "fup": true, "apr": true, "obs": "Bot já havia apresentado ambulatorial e completo para criança de 6 anos. A retomada humana foi genérica ('você pode falar agora?') e os contatos seguintes focaram campanha/carência zero, sem recuperar a escolha pendente entre os planos."}], "ev": [{"id": "734097771", "who": "Mirella Pereira — Eugênia", "txt": "Cliente recebeu inicialmente oferta restrita e precisou perguntar se era a mais barata e se existiam outros planos. Só depois foi identificado que queria apenas consultas e surgiu o ambulatorial. Evidência de cotação antes da investigação/recomendação."}, {"id": "733715356", "who": "Miriam Ferreira — Eugênia Seller", "txt": "O histórico já mostrava que Stefany era cliente Hapvida e queria reduzir a mensalidade. Na transferência, a primeira pergunta foi se a simulação era para plano novo. A oportunidade é continuar a negociação do ponto em que o bot parou, sem reiniciar a descoberta."}, {"id": "732707095", "who": "Kamila Oliveira — Eugênia Cotação", "txt": "Antônio informou desde o início que viajava muito e precisava de plano nacional, além de já ter enviado o CNPJ. Na retomada, voltou-se a perguntar sobre CNPJ e o follow-up posterior não trabalhou a exigência de cobertura nacional, que continuou sendo a barreira declarada."}, {"id": "735156907", "who": "Jady Queiroz — Eugênia", "txt": "Maria Clara indicou qual opção fazia mais sentido e explicou que só não pagaria naquele dia porque receberia em dia útil. Na retomada, a abordagem voltou a perguntar em qual opção seguir, perdendo uma informação decisiva já disponível."}, {"id": "731004390", "who": "Sofia Lunga — Eugênia Seller — CONTRAPONTO", "txt": "Sofia fez follow-up sobre a pendência real: pagamento. Perguntou se o pagamento deu certo, ofereceu apoio em caso de dificuldade e alertou sobre expiração da proposta. É o comportamento esperado para retomada orientada pela última barreira."}], "lei": "Na amostra consolidada de 22 IDs de Eugênia, Eugênia Cotação e Eugênia Seller, o SLA aparece como um sinal operacional relevante, mas não deve ser a pauta central desta leitura. O maior risco comercial está na perda de continuidade entre o que o cliente já informou e a forma como o atendimento humano assume a negociação.\n\nO principal ofensor comercial classificado foi aproveitamento das informações, presente em 13 de 22 atendimentos (59.1%). Em diferentes jornadas, o bot já havia coletado cidade, idade, composição, produto, motivo de compra, orçamento ou até a barreira específica para fechar. Quando o promotor repete perguntas, pergunta novamente qual opção o cliente quer ou inicia uma abordagem genérica, parte do valor desse histórico é perdida.\n\nTambém há recorrência de 'cotando mais do que recomendando': opções são apresentadas, porém o cliente muitas vezes permanece responsável por decidir sozinho. O comportamento esperado é transformar as informações coletadas em uma indicação objetiva: qual plano faz mais sentido, por quê, qual limitação precisa ser considerada e qual próximo passo deve ser tomado.\n\nNo follow-up, a oportunidade é sair de mensagens amplas como 'vamos seguir?' e retomar a última barreira real. Se o cliente parou por preço, a retomada deve trabalhar preço; se precisava de cobertura nacional, essa deve ser a pauta; se faltava pagamento, o contato deve ser sobre pagamento. O caso de Sofia Lunga mostra essa prática aplicada de forma mais aderente.\n\nImpacto comercial: quando o histórico não é utilizado e a recomendação não é clara, alongamos a jornada, aumentamos o esforço do cliente e reduzimos a chance de transformar intenção em fechamento. A solução é estabelecer uma passagem de bastão: antes de interagir, ler as últimas informações, identificar a barreira atual e iniciar a conversa exatamente desse ponto.", "op": "OPORTUNIDADE PRINCIPAL: criar uma regra de continuidade para as três filas. Antes da primeira mensagem humana, o promotor deve identificar no histórico: 1) o que o cliente procura; 2) quais opções/valores já recebeu; 3) qual foi a última objeção ou pendência; e 4) qual recomendação será feita. A abordagem deve começar pela última barreira, e não por uma nova descoberta.", "nota": "Nota metodológica: foram considerados os 22 IDs recuperados no bloco de arquivos enviado para Eugênia, Eugênia Cotação e Eugênia Seller em 28/09/2026. A classificação é conservadora e baseada nas evidências recuperadas dos próprios atendimentos; um mesmo ID pode conter mais de um ofensor, portanto os percentuais não somam 100%. Arquivos identificados como 'continuação' foram mantidos como IDs distintos porque representam sessões distintas no histórico."}, {"key": "pme", "short": "PME", "long": "PME", "title": "PME | DIAGNÓSTICO DOS 5 PRINCIPAIS OFENSORES", "pauta": null, "rows": [{"id": "725155532", "colab": "Deliane Gonzaga Gomes", "obj": true, "sla": true, "cot": true, "fup": true, "apr": true, "obs": "Cliente buscava o menor valor possível, considerou o preço 'um pouco salgado', comparou CPF/CNPJ e perguntou se incluir outra pessoa reduziria o valor. Houve novas simulações e follow-up, mas faltou transformar orçamento, composição e barreira de preço em recomendação objetiva e fechamento."}, {"id": "735187102", "colab": "Julia Silva", "obj": false, "sla": true, "cot": true, "fup": false, "apr": false, "obs": "Promotora confirmou plano novo, cidade/idade, apresentou opções de coparticipação e explicou diferenças. Ao final perguntou 'Qual plano ficaria melhor?', deixando a escolha com o cliente em vez de recomendar a opção mais aderente ao perfil levantado."}, {"id": "732192095", "colab": "Bruna Campassi", "obj": false, "sla": true, "cot": false, "fup": false, "apr": false, "obs": "Atendimento PME/NDI com documentação empresarial, boleto, desconto de 50% + taxa de adesão e follow-ups sobre pagamento/comprovante. Houve múltiplos registros de SLA, mas a jornada comercial avançou para etapa de pagamento."}], "ev": [{"id": "725155532", "who": "Deliane Gonzaga Gomes", "txt": "CASO MAIS REPRESENTATIVO: cliente busca o menor valor possível, considera o preço 'um pouco salgado', compara CPF/CNPJ e pergunta se incluir outra pessoa reduziria o valor. Foram feitas simulações, mas havia oportunidade de usar orçamento, composição e objeção para recomendar a melhor estrutura e conduzir ao fechamento."}, {"id": "735187102", "who": "Julia Silva", "txt": "Após levantar plano novo, cidade e idade, são apresentadas opções e diferenças de coparticipação. A pergunta 'Qual plano ficaria melhor?' transfere a decisão ao cliente. Oportunidade: o promotor deveria recomendar qual opção é mais adequada e explicar por quê."}, {"id": "732192095", "who": "Bruna Campassi", "txt": "CONTRAPONTO: apesar de múltiplos registros de SLA, a jornada avançou para documentação empresarial, boleto, desconto/taxa de adesão e follow-ups sobre pagamento e comprovante. Mostra que SLA deve ser acompanhado, mas não é a única variável comercial da análise."}], "lei": "Na amostra recuperada de 3 atendimentos PME, o SLA aparece nos 3 casos (100%), mas não é o eixo principal desta leitura. O comportamento comercial mais relevante é 'cotando mais do que recomendando', identificado em 2 dos 3 atendimentos (66,7%).\n\nNo PME, o cliente normalmente entrega várias informações que deveriam orientar a construção da proposta: quantidade e idade das vidas, possibilidade de CPF ou CNPJ, faixa de investimento, preferência por coparticipação e composição da contratação. O risco aparece quando essas informações geram apenas novas simulações e comparações, sem que o promotor assuma uma posição consultiva e diga qual configuração recomenda, por qual motivo e qual deve ser o próximo passo.\n\nA sessão 725155532 concentra os principais sinais: a cliente pede o menor valor possível, considera o preço ainda 'salgado', compara CPF/CNPJ e pergunta se acrescentar uma pessoa reduziria o valor. Essas informações já permitiam estruturar uma recomendação comercial baseada em orçamento e composição. Na sessão 735187102, depois de apresentar as opções, a condução termina perguntando ao próprio cliente qual plano ficaria melhor, quando a oportunidade era justamente recomendar a alternativa mais aderente.\n\nO impacto comercial é transformar uma venda consultiva em uma sequência de cotações. A solução é usar as informações coletadas para reduzir o leque, recomendar uma composição objetiva e conduzir para fechamento. Objeção e follow-up devem partir do mesmo princípio: se preço foi a barreira, a retomada precisa voltar com uma alternativa construída sobre o orçamento já informado.", "op": "OPORTUNIDADE PRINCIPAL: no PME, sair da lógica de apenas simular possibilidades e assumir uma condução consultiva. Depois de entender vidas, CNPJ/CPF, orçamento e cobertura, o promotor deve recomendar a composição mais adequada, justificar a escolha e direcionar o cliente para o fechamento.", "nota": "Nota metodológica: este dashboard considera os 3 atendimentos PME recuperados do bloco indicado no histórico: 725155532, 735187102 e 732192095. A classificação é conservadora e só marca um ofensor quando a evidência recuperada sustenta o comportamento. Um mesmo atendimento pode conter mais de um ofensor; por isso, os percentuais não somam 100%."}, {"key": "carrinho", "short": "Carrinho", "long": "Carrinho", "title": "CARRINHO | DIAGNÓSTICO DOS 5 PRINCIPAIS OFENSORES", "pauta": null, "rows": [{"id": "733796322", "colab": "Isabella Souza", "obj": false, "sla": false, "cot": true, "fup": false, "apr": true, "obs": "Cliente informou Goiânia, 25 anos e que havia tido Hapvida dois meses antes. A condução seguiu para explicação genérica entre ambulatorial/completo, sem usar o histórico recente do cliente para personalizar a recomendação. Quando ele perguntou a diferença de valor, havia oportunidade clara de comparar e recomendar."}, {"id": "735912843", "colab": "Giovanna Barbieri", "obj": false, "sla": true, "cot": true, "fup": true, "apr": true, "obs": "Cliente informou composição/possível dependente e depois respondeu que não possuía CNPJ/MEI. Ainda assim foram mostradas contratação individual e empresarial. Foram enviadas opções e o cliente ficou responsável por analisar qual se adequava melhor. Follow-ups posteriores perguntaram qual opção chamou atenção, sem retomar de forma objetiva a necessidade já informada."}, {"id": "733799804", "colab": "Mariana Prado", "obj": false, "sla": true, "cot": true, "fup": true, "apr": false, "obs": "Cliente disse que precisava voltar a ter plano e pediu para ver os dois tipos. Foram apresentadas opções e diferenças de coparticipação, mas a decisão voltou ao cliente com 'qual deles te atenderia melhor?'. Após a última dúvida, não há evidência de retomada humana antes da mensagem automática posterior."}, {"id": "729973352", "colab": "Aline Gunello", "obj": false, "sla": true, "cot": false, "fup": false, "apr": false, "obs": "Contraponto positivo: cliente já estava em etapa documental. Aline acompanhou assinatura/certidão, retomou no dia seguinte, reforçou prazo e pendência documental e manteve condução para conclusão. Houve registro de SLA, mas o follow-up foi direcionado à barreira real."}, {"id": "726855598", "colab": "Aline Gunello", "obj": false, "sla": true, "cot": false, "fup": false, "apr": false, "obs": "Cliente declarou interesse e informou que seria plano novo empresarial. Aline retomou a simulação pedindo idade e cidade para montar proposta. Há violação de SLA na entrada, mas a evidência disponível mostra continuidade coerente com o contexto informado."}, {"id": "737974317", "colab": "Gabriela Reis", "obj": false, "sla": false, "cot": true, "fup": false, "apr": true, "obs": "Cliente informou possuir MEI e CPF, mas que seria apenas uma pessoa; após esclarecer que PME exigia duas pessoas, definiu contratação por CPF. A condução apresentou ambulatorial/completo e perguntou 'qual fica melhor?', em vez de recomendar com base no contexto já esclarecido."}], "ev": [{"id": "733796322", "who": "Isabella Souza", "txt": "Cliente informa que teve Hapvida há apenas dois meses. Mesmo com esse histórico disponível, a condução volta para uma explicação genérica de ambulatorial x completo. Quando pergunta a diferença de valor, havia oportunidade de aproveitar o histórico e recomendar diretamente uma alternativa."}, {"id": "735912843", "who": "Giovanna Barbieri", "txt": "Cliente informa que não possui CNPJ/MEI, mas depois recebe opção individual e empresarial. Também diz que vai analisar qual se adequa melhor. Aqui se cruzam três oportunidades: usar corretamente a informação já fornecida, recomendar em vez de deixar a escolha totalmente com o cliente e fazer follow-up retomando a necessidade real."}, {"id": "729973352", "who": "Aline Gunello — CONTRAPONTO", "txt": "Cliente estava travado em documentação. Aline retoma exatamente a pendência — certidão/assinatura —, reforça prazo e acompanha a regularização. Mostra o comportamento desejado no Carrinho: usar o estágio já alcançado e atuar sobre a barreira que impede a conclusão."}], "lei": "Na amostra recuperada de 6 atendimentos do Carrinho, o principal comportamento comercial identificado é 'cotando mais do que recomendando', presente em 4 casos (66,7%). O SLA também aparece em 4 atendimentos (66,7%), mas, para esta fila, o ponto central da discussão deve ser a qualidade da continuidade da venda, porque o cliente do Carrinho já chega com intenção demonstrada e, em muitos casos, com informações previamente fornecidas.\n\nEm 3 atendimentos (50,0%), encontramos oportunidade de aproveitar melhor informações já disponíveis. Há exemplos de cliente que havia tido Hapvida recentemente, cliente que informou não possuir CNPJ/MEI e cliente que já havia definido que a contratação seria por CPF. Quando a condução volta para perguntas ou apresentações genéricas, perdemos justamente a vantagem do Carrinho: o histórico deveria permitir avançar mais rápido para recomendação e fechamento.\n\nTambém identificamos 2 casos (33,3%) com oportunidade de follow-up. O ponto não é apenas voltar a falar com o cliente, mas retomar a última barreira ou decisão pendente. O contraponto da sessão 729973352 mostra essa diferença: Aline Gunello acompanha a documentação que estava impedindo a conclusão e mantém o contato direcionado à pendência real.\n\nO impacto comercial é transformar um lead já aquecido em uma nova jornada de descoberta e comparação. A solução é tratar o Carrinho como continuidade de venda: ler o histórico antes da abordagem, partir do ponto em que o cliente parou, recomendar uma alternativa com base no que já sabemos e usar o follow-up para remover a barreira específica que impede o fechamento.", "op": "OPORTUNIDADE PRINCIPAL: no Carrinho, não reiniciar a venda. Usar o histórico e as informações já coletadas para chegar rapidamente à recomendação, retomar a última barreira do cliente e conduzir a oportunidade aquecida para conclusão.", "nota": "Nota metodológica: dashboard construído com 6 atendimentos únicos do Carrinho recuperados dos arquivos/histórico disponíveis: 733796322, 735912843, 733799804, 729973352, 726855598 e 737974317. A classificação é conservadora: um ofensor só foi marcado quando a evidência recuperada o sustenta. Um mesmo atendimento pode conter mais de um ofensor; portanto, os percentuais não somam 100%. No tópico Objeção, a evidência disponível não foi suficiente para classificar ocorrência com segurança."}, {"key": "cancelados", "short": "Base Cancelados", "long": "Base de Cancelados", "title": "BASE DE CANCELADOS | DIAGNÓSTICO DAS MONITORIAS", "pauta": null, "rows": [{"id": "729806776", "colab": "Raissa Burin", "sla": true, "status": "Violação SLA", "obs": "Registro de violação de SLA durante a jornada."}, {"id": "730667151", "colab": "Beatriz Rafaela Silvestre", "sla": true, "status": "Violação SLA", "obs": "Mauro relata preço alto às 09:36:28; SLA às 09:32:01, 09:43:01 e 11:27:01."}, {"id": "729636928", "colab": "Andrezza Machini", "sla": true, "status": "Violação SLA", "obs": "Registro de violação de SLA durante a jornada."}, {"id": "729636952", "colab": "Raissa Burin", "sla": true, "status": "Violação SLA", "obs": "Sthéfany pede as duas opções às 09:11:04; SLA às 09:15:01; cotação às 09:25:03."}, {"id": "732150926", "colab": "Victor Hugo Martins", "sla": true, "status": "Violação SLA", "obs": "Registro de violação de SLA durante a jornada."}, {"id": "729784154", "colab": "Bruno Ferreira", "sla": true, "status": "Violação SLA", "obs": "Cliente quer permanecer no Smart 500 às 12:00:45; SLA às 12:02:01; resposta às 13:50:46 (~1h50)."}, {"id": "732720290", "colab": "Andrezza Machini", "sla": true, "status": "Venda convertida + SLA", "obs": "Houve violação de SLA, mas a negociação foi sustentada até pagamento e comprovante."}, {"id": "730010714", "colab": "Thaisa Almeida", "sla": true, "status": "Violação SLA", "obs": "Registro de violação de SLA durante a jornada."}, {"id": "730785975", "colab": "Victor Hugo Martins", "sla": false, "status": "Sem violação identificada", "obs": "Cliente apresentou objeção de preço; sem violação de SLA identificada na monitoria."}, {"id": "729637733", "colab": "Beatriz Rafaela Silvestre", "sla": false, "status": "Sem violação identificada", "obs": "Cliente declarou 'Sem dinheiro'; atendimento encerrado sem abordagem comercial registrada."}], "ev": [{"id": "730667151", "who": "Beatriz Rafaela", "txt": "Mauro informa às 09:36:28 que o plano ficou muito caro. SLA às 09:32:01, 09:43:01 e 11:27:01. Às 11:23:36 reforça a objeção de preço."}, {"id": "729636952", "who": "Raissa Burin", "txt": "Sthéfany pede às 09:11:04 para ver as duas opções. Há violação às 09:15:01 e a cotação aparece às 09:25:03."}, {"id": "729784154", "who": "Bruno Ferreira — CASO CRÍTICO", "txt": "Cliente diz às 12:00:45 que quer permanecer no Smart 500. SLA às 12:02:01 e resposta somente às 13:50:46 — aproximadamente 1h50 depois."}], "lei": "Na amostra de 10 atendimentos da Base de Cancelados, identificamos violação de SLA em 8 casos, representando 80% dos atendimentos monitorados e envolvendo 6 colaboradores diferentes. A recorrência em diferentes promotores demonstra que o ponto de atenção não está concentrado em um único atendimento ou colaborador, mas aparece como um comportamento recorrente dentro da amostra analisada.\n\nAs evidências também mostram que a demora não acontece somente na abordagem inicial. Encontramos clientes aguardando retorno durante momentos importantes da negociação, inclusive após demonstrarem interesse, solicitarem opções de cotação ou apresentarem objeções. No caso mais crítico, o cliente informou que desejava permanecer no plano e aguardou aproximadamente 1h50 pela continuidade do atendimento.\n\nA oportunidade, portanto, é ampliar a gestão do SLA para toda a jornada comercial. Além de garantir a abordagem inicial em até 2 minutos, precisamos acompanhar o tempo de resposta sempre que o cliente voltar a interagir, principalmente após sinais de intenção de compra. O objetivo é preservar o ritmo da negociação e evitar que uma oportunidade ativa perca força enquanto aguarda a atuação do promotor.", "op": "OPORTUNIDADE: não medir apenas quanto tempo levamos para receber o lead, mas quanto tempo o cliente fica esperando enquanto está negociando.", "nota": null}, {"key": "adesao", "short": "Adesão", "long": "Adesão", "title": "ADESÃO | DIAGNÓSTICO DOS 5 PRINCIPAIS OFENSORES", "pauta": null, "rows": [{"id": "729682301", "colab": "Thiago Abelo", "obj": false, "sla": false, "cot": false, "fup": true, "apr": false, "obs": "Após cotação e dúvidas sobre uso/carência/coparticipação, as retomadas não trabalharam de forma específica a última dúvida/necessidade do cliente."}, {"id": "730846912", "colab": "Giovanna Ragonezi", "obj": true, "sla": true, "cot": true, "fup": false, "apr": true, "obs": "Cliente informou preço alto, teto de R$ 550 e prioridade hospitalar/emergência; depois declarou não ter entendido a proposta. Faltou transformar essas informações em recomendação mais simples e direcionada."}, {"id": "731047690", "colab": "Thiago Abelo", "obj": true, "sla": true, "cot": false, "fup": false, "apr": false, "obs": "Cliente encerrou dizendo que os planos eram muito caros. Houve questionamento da objeção, mas não foi construída alternativa concreta de produto/faixa de valor antes do encerramento."}, {"id": "729666006", "colab": "Bruno Ferreira", "obj": false, "sla": true, "cot": true, "fup": true, "apr": false, "obs": "Cliente pediu orçamento por CPF e CNPJ e recebeu opções. A condução ficou concentrada na apresentação das alternativas e não houve retomada comercial personalizada antes do encerramento."}, {"id": "732887203", "colab": "Thami Francisquelli", "obj": false, "sla": true, "cot": false, "fup": true, "apr": false, "obs": "Houve envio de proposta e tentativa de fechamento no dia seguinte; oportunidade de tornar a retomada mais conectada ao ponto em que a negociação havia parado."}, {"id": "730012590", "colab": "Giovanna Ragonezi", "obj": true, "sla": true, "cot": false, "fup": false, "apr": true, "obs": "Cliente disse 'Mt cara' e informou teto de R$ 400. O orçamento foi identificado, mas a jornada teve sucessivas violações de SLA e não chegou ao fechamento."}, {"id": "732095411", "colab": "Thami Francisquelli", "obj": false, "sla": true, "cot": false, "fup": false, "apr": true, "obs": "Cliente trouxe informações sobre coparticipação, desconto para duas pessoas e possibilidade de PJ; havia insumos para recomendação mais direcionada, mas a negociação terminou sem conversão."}, {"id": "730709910", "colab": "Bruno Ferreira", "obj": false, "sla": true, "cot": false, "fup": false, "apr": true, "obs": "Atendimento iniciou com informação sobre o plano atual, mas não evoluiu para investigação/cotação; informação disponível não foi convertida em avanço comercial."}, {"id": "733085232", "colab": "Thami Francisquelli", "obj": false, "sla": true, "cot": false, "fup": false, "apr": false, "obs": "CONTRAPONTO POSITIVO: negociação sustentada, dúvidas de carência/terapias/coparticipação tratadas, retomada no dia seguinte, boleto gerado e comprovante de pagamento recebido."}], "ev": [{"id": "730846912", "who": "Giovanna Ragonezi", "txt": "Cliente entrega três informações decisivas: considera o valor alto, define teto de R$ 550 e prioriza hospitalar/emergência. Depois ainda relata não ter entendido a proposta. A oportunidade era usar esses dados para simplificar a oferta e recomendar objetivamente a opção mais aderente ao orçamento e à cobertura desejada."}, {"id": "730012590", "who": "Giovanna Ragonezi", "txt": "Cliente reage com “Mt cara” e informa que consegue pagar no máximo R$ 400. O teto de investimento passa a ser conhecido, mas a negociação não chega ao fechamento. A informação financeira deveria funcionar como direcionador imediato para nova alternativa e recomendação."}, {"id": "732095411 + 730709910", "who": "Thami / Bruno", "txt": "Nos dois casos já existiam informações úteis para avançar: composição, coparticipação, desconto/PJ ou plano atual. A oportunidade é evitar reiniciar ou manter a conversa genérica e transformar o histórico disponível em próxima ação comercial."}], "lei": null, "op": null, "nota": null}, {"key": "repique", "short": "Repique", "long": "Repique", "title": "REPIQUE | DIAGNÓSTICO DOS 5 PRINCIPAIS OFENSORES", "pauta": null, "rows": [{"id": "740666428", "colab": "Viviane Gumbio", "obj": true, "sla": false, "cot": false, "fup": true, "apr": true, "obs": "Cliente informou que o plano estava muito caro e o chat foi resolvido. Não houve exploração da objeção, contraproposta ou retomada direcionada, apesar do histórico já disponível."}, {"id": "744425359", "colab": "Beatriz Giglio", "obj": true, "sla": true, "cot": true, "fup": true, "apr": true, "obs": "Objeção explícita de preço; SLA violado; repetição de cidade/idade; follow-up genérico/tardio; necessidade de consultas, exames, emergência e possível internação já estava disponível, mas não virou recomendação objetiva."}, {"id": "738006072", "colab": "Beatriz Giglio", "obj": false, "sla": false, "cot": true, "fup": true, "apr": true, "obs": "SLA inicial conforme, porém a monitoria apontou deficiência no uso do histórico, follow-up e produto. Havia oportunidade de partir do contexto existente e avançar para recomendação/fechamento."}], "ev": [{"id": "740666428", "who": "Viviane Gumbio", "txt": "OBJEÇÃO + HISTÓRICO + FOLLOW-UP: cliente informa que o plano está muito caro. A negociação é encerrada sem investigar teto de investimento, reposicionar produto ou retomar com base no histórico de preços já apresentado."}, {"id": "744425359", "who": "Beatriz Giglio", "txt": "CASO MAIS COMPLETO: cliente já havia informado necessidade de consultas, exames, emergência e possível internação e depois pede opção mais em conta. Há repetição de perguntas, SLA violado, follow-up genérico/tardio e ausência de recomendação construída sobre necessidade + preço."}, {"id": "738006072", "who": "Beatriz Giglio", "txt": "SLA inicial conforme, mas a monitoria apontou deficiência no uso do histórico e no follow-up. O caso mostra que, no Repique, velocidade sozinha não resolve quando a retomada não utiliza o contexto existente."}], "lei": "Na amostra recuperada de 3 atendimentos do Repique, a principal pauta é o aproveitamento das informações já disponíveis, identificado nos 3 casos (100%), e diretamente conectado à qualidade do follow-up, também presente como oportunidade nos 3 atendimentos.\n\nO Repique trabalha uma oportunidade que já teve contato anterior. Por isso, cidade, idade, necessidade, produto, preço apresentado e motivo da não conversão deveriam ser o ponto de partida. Quando o promotor repete perguntas, faz retomada genérica ou volta apenas a apresentar opções, perde-se a principal vantagem dessa fila: já conhecer parte da jornada.\n\nNos casos 740666428 e 744425359, a objeção de preço aparece explicitamente. A oportunidade era usar essa informação para negociar: entender o teto, readequar cobertura, comparar alternativa e construir uma recomendação. No caso 738006072, mesmo com SLA inicial conforme, houve deficiência em histórico e follow-up, mostrando que responder rápido não é suficiente quando a retomada não utiliza o contexto existente.\n\nO impacto comercial é recuperar o lead sem recuperar a negociação. A solução é iniciar o Repique pela última informação relevante do histórico, trabalhar a objeção real e apresentar uma recomendação nova e objetiva, em vez de reconstruir toda a jornada.", "op": "OPORTUNIDADE PRINCIPAL: no Repique, não recomeçar o atendimento. Antes da abordagem, identificar no histórico o que o cliente queria, qual valor/produto recebeu e por que não avançou. A retomada deve começar por essa barreira, trazer uma alternativa e conduzir novamente ao fechamento.", "nota": "Nota metodológica: dashboard construído somente com os 3 atendimentos de Repique recuperados com evidência suficiente: 740666428, 744425359 e 738006072. A classificação é conservadora; um mesmo atendimento pode conter mais de um ofensor, portanto os percentuais não somam 100%. O atendimento 743482436, relacionado à regularização de débito/SAC, não foi incluído como ofensor comercial do Repique."}];
const OFF=[
  {k:'apr',n:'Aproveitamento das informações'},
  {k:'cot',n:'Cotando mais do que recomendando'},
  {k:'fup',n:'Follow-up'},
  {k:'obj',n:'Objeção'},
  {k:'sla',n:'SLA'}
];
const SHORT={apr:'Aproveit. info.',cot:'Cotando > recom.',fup:'Follow-up',obj:'Objeção',sla:'SLA'};
const PAUTA={eugenia:'apr',pme:'cot',carrinho:'cot',adesao:'apr',repique:'apr'};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct=(a,b)=>b?(a/b*100).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%':'—';
const cnt=(R,k)=>R.filter(r=>r[k]).length;

function tag(who){
  const w=who.toUpperCase();
  if(w.includes('CONTRAPONTO'))return '<span class="pill p-ok">Contraponto positivo</span>';
  if(w.includes('CRÍTICO'))return '<span class="pill p-bad">Caso crítico</span>';
  return '';
}
function evTag(txt){
  if(/^CONTRAPONTO/i.test(txt))return '<span class="pill p-ok">Contraponto positivo</span>';
  if(/^CASO MAIS/i.test(txt))return '<span class="pill p-info">Caso mais representativo</span>';
  return '';
}
function evCards(t){
  return `<div class="evs">${t.ev.map(e=>{
    const who=e.who.replace(/\s+—\s+(CONTRAPONTO|CASO CRÍTICO)$/i,'');
    const txt=e.txt.replace(/^(CONTRAPONTO|CASO MAIS (REPRESENTATIVO|COMPLETO)):\s*/i,'');
    return `<article class="ev"><div class="top"><span class="who">${esc(who)}</span>${tag(e.who)}${evTag(e.txt)}</div><div class="mono note">ID ${esc(e.id)}</div><p>${esc(txt)}</p></article>`}).join('')}</div>`;
}
function reading(t){
  if(!t.lei&&!t.op)return '';
  let h='';
  if(t.op){let o=t.op.replace(/^OPORTUNIDADE( PRINCIPAL)?:\s*/,'');o=o.charAt(0).toUpperCase()+o.slice(1);h+=`<section class="opp"><div class="lbl">Oportunidade principal</div><p>${esc(o)}</p></section>`}
  if(t.lei){const ps=t.lei.split(/\n\s*\n/);h+=`<section class="card"><div class="chead"><h2>Leitura gerencial</h2></div><div class="read"><p>${esc(ps[0])}</p>${ps.length>1?`<details><summary>Ler leitura completa</summary><div class="read">${ps.slice(1).map(p=>`<p>${esc(p)}</p>`).join('')}</div></details>`:''}</div></section>`}
  return h;
}
const lvl=r=>r<=0?'c0':r<=.25?'cl1':r<=.5?'cl2':r<=.75?'cl3':r<1?'cl4':'cl5';

function ofensorPanel(t){
  const R=t.rows,N=R.length,pk=PAUTA[t.key];
  const promos=[...new Set(R.map(r=>r.colab))];
  const sla=cnt(R,'sla'),pc=cnt(R,pk);
  const list=OFF.map(o=>({...o,c:cnt(R,o.k)})).sort((a,b)=>b.c-a.c||(a.k==='sla')-(b.k==='sla'));
  const perId=R.map(r=>OFF.filter(o=>r[o.k]).length);
  const media=(perId.reduce((a,b)=>a+b,0)/N).toLocaleString('pt-BR',{maximumFractionDigits:1});
  let h=`<div class="kpis">
    <div class="kpi"><span class="lbl">Amostra analisada</span><b>${N}</b><span class="sub">atendimentos monitorados</span></div>
    <div class="kpi hl"><span class="lbl">Pauta principal</span><b class="txt">${esc(OFF.find(o=>o.k===pk).n)}</b><span class="sub">${pc} de ${N} atendimentos · ${pct(pc,N)}</span></div>
    <div class="kpi"><span class="lbl">SLA violado</span><b>${pct(sla,N)}</b><span class="sub">${sla} de ${N} · sinal operacional</span></div>
    <div class="kpi"><span class="lbl">Promotores envolvidos</span><b>${promos.length}</b><span class="sub">média de ${media} ofensores por atendimento</span></div>
  </div>`;
  // bars
  h+=`<section class="card"><div class="chead"><h2>Os 5 ofensores na amostra</h2><span class="note">% dos ${N} atendimentos</span></div><div class="bars">`+
    list.map(o=>{const isP=o.k===pk,isS=o.k==='sla';const col=isP?'var(--accent)':isS?'var(--neutral-bar)':'var(--accent-2)';
      return `<div class="brow hit" data-tip="${esc(o.n)}: ${o.c} de ${N} atendimentos (${pct(o.c,N)})"><div class="name">${isP?'<small>Pauta principal</small>':isS?'<small>Operacional</small>':''}${esc(o.n)}</div><div class="track"><div class="fill" style="width:${N?o.c/N*100:0}%;background:${col}"></div></div><div class="val">${o.c} <span>· ${pct(o.c,N)}</span></div></div>`}).join('')+
    `</div><div class="legend"><span><i style="background:var(--accent)"></i>Pauta principal</span><span><i style="background:var(--accent-2)"></i>Outros ofensores comerciais</span><span><i style="background:var(--neutral-bar)"></i>SLA (operacional)</span></div><p class="note">Um atendimento pode ter mais de um ofensor; os percentuais não somam 100%.</p></section>`;
  // matrix
  const prow=promos.map(p=>{const S=R.filter(r=>r.colab===p);return {p,S,tot:OFF.reduce((a,o)=>a+cnt(S,o.k),0)}}).sort((a,b)=>b.tot-a.tot||b.S.length-a.S.length||a.p.localeCompare(b.p));
  h+=`<section class="card"><div class="chead"><h2>Onde cada promotor(a) concentra os ofensores</h2><span class="scale">0%<i style="background:var(--s1)"></i><i style="background:var(--s2)"></i><i style="background:var(--s3)"></i><i style="background:var(--s4)"></i><i style="background:var(--s5)"></i>100%</span></div><div class="tbl"><table class="mx"><thead><tr><th>Promotor(a)</th><th class="n">Atend.</th>${list.map(o=>`<th class="n">${SHORT[o.k]}</th>`).join('')}</tr></thead><tbody>`+
    prow.map(({p,S})=>`<tr><td>${esc(p)}</td><td class="n">${S.length}</td>${list.map(o=>{const c=cnt(S,o.k);return `<td class="c"><span class="cell hit ${lvl(c/S.length)}" data-tip="${esc(p)} · ${esc(o.n)}: ${c} de ${S.length} atendimento(s)">${c?c+'/'+S.length:'—'}</span></td>`}).join('')}</tr>`).join('')+
    `</tbody></table></div><p class="note">Cada célula mostra em quantos atendimentos do(a) promotor(a) o ofensor apareceu. Ordenado pelo total de ofensores.</p></section>`;
  // fila breakdown (Eugênia)
  if(R.some(r=>r.fila)){
    const filas=[...new Set(R.map(r=>r.fila))];
    h+=`<section class="card"><div class="chead"><h2>Ofensores por fila</h2><span class="note">quantidade e % dos atendimentos de cada fila</span></div><div class="tbl"><table class="mx"><thead><tr><th>Fila</th><th class="n">Atend.</th>${list.map(o=>`<th class="n">${SHORT[o.k]}</th>`).join('')}</tr></thead><tbody>`+
      filas.map(f=>{const S=R.filter(r=>r.fila===f);return `<tr><td>${esc(f)}</td><td class="n">${S.length}</td>${list.map(o=>{const c=cnt(S,o.k);return `<td class="c"><span class="cell hit ${lvl(c/S.length)}" data-tip="${esc(f)} · ${esc(o.n)}: ${c} de ${S.length} (${pct(c,S.length)})">${c?pct(c,S.length):'—'}</span></td>`}).join('')}</tr>`}).join('')+
      `</tbody></table></div></section>`;
  }
  h+=reading(t);
  h+=`<section class="chead" style="margin-top:4px"><h2>Evidências fortes</h2></section>`+evCards(t);
  // base
  h+=`<section class="card"><details><summary>Ver base de monitorias (${N} atendimentos)</summary><div class="tbl"><table><thead><tr><th>ID</th>${R.some(r=>r.fila)?'<th>Fila</th>':''}<th>Promotor(a)</th>${OFF.map(o=>`<th class="n">${SHORT[o.k]}</th>`).join('')}<th>Evidência / observação</th></tr></thead><tbody>`+
    R.map(r=>`<tr><td class="id">${esc(r.id)}</td>${r.fila!==undefined?`<td>${esc(r.fila)}</td>`:''}<td>${esc(r.colab)}</td>${OFF.map(o=>`<td class="n"><span class="dot${r[o.k]?'':' no'}" role="img" aria-label="${r[o.k]?'Sim':'Não'}"></span></td>`).join('')}<td class="obs">${esc(r.obs)}</td></tr>`).join('')+
    `</tbody></table></div></details></section>`;
  if(t.nota)h+=`<p class="note" style="max-width:90ch">${esc(t.nota)}</p>`;
  return h;
}

function canceladosPanel(t){
  const R=t.rows,N=R.length,v=cnt(R,'sla');
  const promos=[...new Set(R.map(r=>r.colab))];
  const pv=[...new Set(R.filter(r=>r.sla).map(r=>r.colab))];
  const conv=R.filter(r=>/Venda/i.test(r.status||'')).length;
  let h=`<div class="kpis">
    <div class="kpi"><span class="lbl">Amostra analisada</span><b>${N}</b><span class="sub">atendimentos monitorados</span></div>
    <div class="kpi hl"><span class="lbl">Com violação de SLA</span><b>${v}</b><span class="sub">${v} de ${N} atendimentos</span></div>
    <div class="kpi"><span class="lbl">Incidência de SLA</span><b>${pct(v,N)}</b><span class="sub">da amostra</span></div>
    <div class="kpi"><span class="lbl">Promotores com violação</span><b>${pv.length}</b><span class="sub">de ${promos.length} promotores na amostra</span></div>
  </div>`;
  // split bar
  h+=`<div class="grid2"><section class="card"><div class="chead"><h2>SLA na amostra</h2><span class="note">${N} atendimentos</span></div>
    <div style="display:flex;height:22px;border-radius:4px;overflow:hidden;gap:2px">
      <div class="hit" style="width:${v/N*100}%;background:var(--bad)" data-tip="Com violação: ${v} (${pct(v,N)})"></div>
      <div class="hit" style="width:${(N-v)/N*100}%;background:var(--ok)" data-tip="Sem violação: ${N-v} (${pct(N-v,N)})"></div>
    </div>
    <div class="legend"><span><i style="background:var(--bad)"></i>✕ Com violação · ${v} (${pct(v,N)})</span><span><i style="background:var(--ok)"></i>✓ Sem violação · ${N-v} (${pct(N-v,N)})</span></div>
    ${conv?`<p class="note">${conv} dos atendimentos com violação ainda converteu em venda (negociação sustentada até o pagamento).</p>`:''}
  </section>`;
  const pr=promos.map(p=>{const S=R.filter(r=>r.colab===p);return {p,n:S.length,v:cnt(S,'sla')}}).sort((a,b)=>b.v-a.v||b.n-a.n||a.p.localeCompare(b.p));
  const mx=Math.max(...pr.map(x=>x.n));
  h+=`<section class="card"><div class="chead"><h2>Violações por promotor(a)</h2><span class="note">violações / atendimentos</span></div><div class="bars">`+
    pr.map(x=>`<div class="brow hit" data-tip="${esc(x.p)}: ${x.v} violação(ões) em ${x.n} atendimento(s)"><div class="name">${esc(x.p)}</div><div class="track"><div class="fill" style="width:${x.n/mx*100}%;background:var(--accent-3);border-radius:4px"></div><div class="fill" style="width:${x.v/mx*100}%;background:var(--bad)"></div></div><div class="val">${x.v} <span>/ ${x.n}</span></div></div>`).join('')+
    `</div><div class="legend"><span><i style="background:var(--bad)"></i>Atendimentos com violação</span><span><i style="background:var(--accent-3)"></i>Total de atendimentos</span></div></section></div>`;
  h+=reading(t);
  h+=`<section class="chead" style="margin-top:4px"><h2>Evidências fortes</h2></section>`+evCards(t);
  const st=s=>/Venda/i.test(s)?'<span class="pill p-warn">Venda convertida + SLA</span>':/Sem/i.test(s)?'<span class="pill p-ok">✓ Sem violação</span>':'<span class="pill p-bad">✕ Violação SLA</span>';
  h+=`<section class="card"><details><summary>Ver base de monitorias (${N} atendimentos)</summary><div class="tbl"><table><thead><tr><th>ID</th><th>Promotor(a)</th><th>Status</th><th>Evidência / observação</th></tr></thead><tbody>`+
    R.map(r=>`<tr><td class="id">${esc(r.id)}</td><td>${esc(r.colab)}</td><td>${st(r.status||'')}</td><td class="obs">${esc(r.obs)}</td></tr>`).join('')+`</tbody></table></div></details></section>`;
  return h;
}

const tabs=$('tabs');
tabs.innerHTML=DATA.map((t,i)=>`<button class="tab" role="tab" id="tab-${t.key}" aria-selected="false" aria-controls="panel" data-k="${t.key}"><b>${esc(t.short)}</b><span>${t.rows.length} atendimentos</span></button>`).join('');
function show(k,push){
  const t=DATA.find(d=>d.key===k)||DATA[0];
  tabs.querySelectorAll('.tab').forEach(b=>{const on=b.dataset.k===t.key;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1});
  const head=`<div class="phead"><div><div class="eyebrow">${esc(t.long)}</div><h2 style="font-size:20px;margin-top:2px">${t.key==='cancelados'?'Diagnóstico de SLA nas monitorias':'Diagnóstico dos 5 principais ofensores'}</h2></div></div>`;
  $('panel').innerHTML=head+(t.key==='cancelados'?canceladosPanel(t):ofensorPanel(t));
  $('panel').setAttribute('aria-labelledby','tab-'+t.key);
  if(push){try{history.replaceState(null,'','#'+t.key)}catch(e){}}
  try{localStorage.setItem('mon-tab',t.key)}catch(e){}
}
tabs.addEventListener('click',e=>{const b=e.target.closest('.tab');if(b){show(b.dataset.k,true);b.scrollIntoView({block:'nearest',inline:'nearest'})}});
tabs.addEventListener('keydown',e=>{if(!['ArrowRight','ArrowLeft'].includes(e.key))return;const bs=[...tabs.querySelectorAll('.tab')];const i=bs.findIndex(b=>b.getAttribute('aria-selected')==='true');const n=bs[(i+(e.key==='ArrowRight'?1:-1)+bs.length)%bs.length];n.focus();show(n.dataset.k,true)});
let start=(location.hash||'').slice(1);if(!DATA.some(d=>d.key===start)){try{start=localStorage.getItem('mon-tab')||''}catch(e){start=''}}
show(start||DATA[0].key,false);
// tooltip
const tip=$('tip');
document.addEventListener('mousemove',e=>{const h=e.target.closest('.hit');if(!h||!h.dataset.tip){tip.hidden=true;return}tip.textContent=h.dataset.tip;tip.hidden=false;const x=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8),y=Math.min(e.clientY+14,innerHeight-tip.offsetHeight-8);tip.style.left=x+'px';tip.style.top=y+'px'});
document.addEventListener('mouseleave',()=>tip.hidden=true);
</script>

</body>
</html>
