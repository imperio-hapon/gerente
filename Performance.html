:root{

  --line:#e2e6ec; --line-strong:#ccd3dd;

  --good:#157a3c; --good-soft:#e3f4e9; --bad:#b4232b; --bad-soft:#fde8e8; --warn:#8a5300; --warn-soft:#fff3d6;

}

  --brand-bar:#0b1736; --brand-ink:#e7ecf4; --brand-muted:#8aa4ec;
  --good:#5cc98a; --good-soft:#123222; --bad:#f08a8f; --bad-soft:#3a1719; --warn:#f2bf55; --warn-soft:#33270d;
  --shadow:0 2px 10px -2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141e; --surface:#161f2d; --surface-2:#1d2838; --ink:#e7ecf4; --ink-2:#b4bfcf; --muted:#8c98ab;
  --line:#26324a; --line-strong:#34425c;
  --primary:#6d8fe8; --primary-ink:#9db4f2; --primary-soft:#1b2a52; --bar-weak:#3b4f86; --heat:109,143,232;
  --brand-bar:#0b1736; --brand-ink:#e7ecf4; --brand-muted:#8aa4ec;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--brand-bar);color:var(--brand-ink)}
.brand{max-width:1240px;margin:0 auto;padding:12px 24px 0;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand b{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:-.01em}
.brand span{color:var(--brand-muted);font-size:12px}
.tabs{max-width:1240px;margin:0 auto;padding:8px 24px 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.tab{appearance:none;border:0;background:transparent;color:var(--brand-muted);font:500 13px/1 var(--f-body);padding:11px 14px 13px;border-radius:8px 8px 0 0;white-space:nowrap;cursor:pointer;position:relative}
.tab:hover{color:var(--brand-ink);background:rgba(255,255,255,.07)}
.tab[aria-selected="true"]{background:var(--bg);color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--accent-warm);outline-offset:-2px}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent-warm);margin-left:6px;vertical-align:middle}
main{max-width:1240px;margin:0 auto;padding-inline:24px;padding-block:28px 64px}
.page{display:grid;gap:22px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:500;font-size:32px;line-height:1.15;margin:4px 0 6px;letter-spacing:-.02em;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--ink-2);max-width:78ch;margin:0}
.hint{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow);min-width:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:15px;font-weight:500;color:var(--ink-2)}
.kpi .t{font-family:var(--f-display);font-size:18px;font-weight:600;line-height:1.2;margin-top:6px}
.kpi .d{color:var(--ink-2);font-size:12.5px;margin-top:4px}
.resumo{background:var(--primary-soft);border-radius:var(--r);padding:18px 22px;display:grid;gap:6px}
.resumo p{margin:0;font-size:15.5px;line-height:1.55;max-width:95ch}
.resumo .eyebrow{color:var(--primary-ink)}
.two{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
/* bars */
.bars{display:grid;gap:14px}
.bar-row{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr) 92px;gap:14px;align-items:center}
.bar-row .lbl b{display:block;font-weight:600;font-size:13.5px}
.bar-row .lbl > span{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.track{position:relative;height:22px;background:var(--surface-2);border-radius:4px}
.fill{position:absolute;inset:0 auto 0 0;background:var(--primary);border-radius:4px}
.fill.ctx{background:var(--bar-weak)}
.fill.top{background:var(--primary)}
.ghost{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink-2);opacity:.75}
.val{text-align:right;font-variant-numeric:tabular-nums}
.val b{font-size:15px;font-family:var(--f-display)}
.val span{display:block;color:var(--muted);font-size:11.5px}
.tag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);margin-left:6px;vertical-align:1px}
.legend-note{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:14px}
.legend-note i{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
/* actions */
ol.acoes{margin:0;padding:0;list-style:none;counter-reset:a;display:grid;gap:10px}
ol.acoes li{counter-increment:a;display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start}
ol.acoes li::before{content:counter(a);width:24px;height:24px;border-radius:50%;background:var(--primary-soft);color:var(--primary-ink);font:600 12px/24px var(--f-body);text-align:center}
/* table */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
th.c,td.c{text-align:center}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr.main{cursor:pointer}
tbody tr.main:hover td{background:var(--surface-2)}
tbody tr.main:focus-visible td{outline:2px solid var(--primary);outline-offset:-2px}
tr.excl td{color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
.yes{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--bad)}
.no{display:inline-block;width:10px;height:2px;background:var(--line-strong);vertical-align:middle}
tr.excl .yes{background:var(--line-strong)}
.chip{display:inline-block;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip.perda{background:var(--bad-soft);color:var(--bad)}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.ex{background:var(--surface-2);color:var(--muted)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.flag{display:inline-block;font-size:10.5px;color:var(--warn);background:var(--warn-soft);padding:1px 6px;border-radius:4px;margin-left:6px}
tr.det td{background:var(--surface-2);padding:12px 14px 14px;color:var(--ink-2)}
tr.det p{margin:0 0 4px;max-width:110ch}
tr.det b{color:var(--ink)}
.caret{display:inline-block;transition:transform .16s;color:var(--muted);margin-right:6px}
tr.open .caret{transform:rotate(90deg)}
/* cases */
.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.case{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--surface);display:grid;gap:6px;align-content:start}
.case .h{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.case p{margin:0;color:var(--ink-2);font-size:13px}
.case .who{font-weight:600;font-size:13.5px}
/* adjust */
.ajustes{border:1px dashed var(--line-strong);border-radius:var(--r);padding:16px 20px;background:transparent}
.ajustes ul{margin:8px 0 0;padding-left:18px;display:grid;gap:6px;color:var(--ink-2)}
.ajustes li{max-width:110ch}
/* heat */
.heat td.h{text-align:center;font-variant-numeric:tabular-nums;font-weight:500;min-width:76px}
.heat td.fila{font-weight:600;white-space:nowrap}
.heat tr.click{cursor:pointer}
.heat tr.click:hover td.fila{color:var(--primary-ink);text-decoration:underline}
/* compare */
.cmp{display:grid;gap:14px}
.cmp-row{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr) 84px;gap:14px;align-items:center}
.cmp-bars{display:grid;gap:4px}
.cmp-bars .track{height:13px}
.delta{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;font-size:13px}
.delta.up{color:var(--bad)} .delta.down{color:var(--good)} .delta.na{color:var(--muted);font-weight:400}
.stack{display:flex;height:34px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surface)}
.stack div{display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;color:#fff;min-width:0}
.gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.gloss div{border-left:0;background:var(--surface-2);border-radius:8px;padding:12px 14px}
.gloss b{display:block;font-size:13.5px;margin-bottom:2px}
.gloss span{color:var(--ink-2);font-size:12.5px}
.foot{color:var(--muted);font-size:12px;max-width:100ch}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:minmax(0,1fr)}}

  main{padding-inline:16px}.brand,.tabs{padding-inline:16px}

  .bar-row .lbl,.cmp-row .lbl{grid-column:1 / -1}
  .card{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function kpis(t){
  const f=t.funil, n=f[0].n;
  const k=(lbl,v,d)=>`<div class="kpi"><div class="eyebrow">${lbl}</div><div class="v">${v}</div><div class="d">${d}</div></div>`;
  const semVenda=f[1].n-f[3].n-t.andamento;
  return `<div class="kpis">
    ${k('Atendimentos analisados', n, 'com evidência registrada')}
    ${k(f[1].l, `${f[1].n} <small>de ${n}</small>`, `${pct(f[1].n/n)} da amostra`)}
    ${k(f[2].l, `${f[2].n} <small>de ${f[1].n}</small>`, f[2].n? `${pct(f[2].n/f[1].n)} dos interessados` : 'nenhum interessado chegou à proposta')}

  </div>`;
}
function funnel(t){
  const n=t.funil[0].n;
  const rows=t.funil.map((s,i)=>{const prev=i?t.funil[i-1].n:null;const w=s.n/n*100;
    return `<div class="f-row"><div class="l">${esc(s.l)}</div><div class="track"><div class="fill ${s.n?'':'zero'}" style="width:${w}%">${s.n&&w>6?s.n:''}</div></div>
    <div class="val"><b>${s.n}</b>${i&&prev-s.n>0?`<span class="drop">−${prev-s.n}</span> na etapa`:i?'sem perda':''}</div></div>`}).join('');
  const tot=t.origem.reduce((a,o)=>a+o.n,0);
  const org=`<h2 style="margin-top:22px">Por que a venda não aconteceu</h2><p class="hint">Origem de cada atendimento. Azul escuro é condução do vendedor; azul claro é demora; laranja é preço, rede, regra de produto ou campanha; cinza está fora do controle do vendedor.</p>
    <div class="stack">${t.origem.map(o=>`<div class="t-${o.t}" style="flex:${o.n}" title="${esc(o.l)}: ${o.n}">${o.n}</div>`).join('')}</div>
    <div class="legend-note" style="margin-top:12px">${t.origem.map(o=>`<span><i style="background:${TCOL[o.t]}"></i>${esc(o.l)}: <b style="color:var(--ink)">${o.n}</b> (${pct(o.n/tot)})</span>`).join('')}</div>`;
  return `<div class="card"><h2>Do interesse à venda</h2><p class="hint">Quantos atendimentos passaram por cada etapa e onde a negociação parou.${t.andamento?` ${t.andamento} atendimento(s) com resultado a conferir não contam como perda.`:''}</p><div class="funnel">${rows}</div>${org}</div>`;
}
function ofensores(t){

  return `<div class="card"><h2>Principais ofensores</h2><p class="hint">Em quantos dos ${t.funil[0].n} atendimentos o problema apareceu. Um atendimento pode ter mais de um. Comercial pede treinamento; operacional e base pedem ajuste de processo.</p>

    <div class="track"><div class="fill ${o.gcls}" style="width:${o.n/o.den*100}%"></div></div>

}

function card(r,ok){

}
function casos(t){

  const pos=t.colabs.some(c=>c.positivo);
  return `<div class="card"><h2>Por colaborador</h2><p class="hint">Não é ranking: a quantidade e o tipo de atendimento variam entre as pessoas. Um atendimento transferido conta para todos que participaram.</p>
  <div class="tbl-wrap"><table><thead><tr><th>Nome</th><th class="c">Atend.</th><th class="c">Interesse</th><th class="c">Proposta</th><th class="c">Vendas</th><th>Onde precisa melhorar</th>${pos?'<th>Ponto positivo</th>':''}<th>Prioridade</th></tr></thead><tbody>
  ${t.colabs.map(c=>`<tr><td style="font-weight:600;white-space:nowrap">${esc(c.nome)}</td><td class="c mono">${c.atend}</td><td class="c mono">${c.int}</td><td class="c mono">${c.prop}</td><td class="c mono">${c.vendas}</td><td class="wrap">${esc(c.ofensor)}${c.etapa?`<div style="color:var(--muted);font-size:12px">Etapa: ${esc(c.etapa)}</div>`:''}</td>${pos?`<td class="wrap" style="color:var(--ink-2)">${esc(c.positivo)||'—'}</td>`:''}<td><span class="prio ${esc(c.prio)}">${esc(c.prio)}</span></td></tr>`).join('')}
  </tbody></table></div></div>`;
}
function filas(t){
  if(!t.filas) return '';
  return `<div class="card"><h2>Por fila</h2><p class="hint">Riscos observados nesta amostra, não um ranking estatístico.</p>
  <div class="fat">${t.filas.map(f=>`<div><b>${esc(f.fila)} <span class="prio ${esc(f.prio)}" style="margin-left:6px">${esc(f.prio)}</span></b><span>${esc(f.txt)}</span></div>`).join('')}</div></div>`;
}
function fatores(t){
  return `<div class="card"><h2>Fora do controle do vendedor</h2><p class="hint">Perdas de processo, base ou sistema, e limites da amostra. Precisam de outro responsável.</p>
  <div class="fat">${t.fatores.map(f=>`<div><b>${esc(f.fator)}</b><span>${esc(f.evid)}</span><em>Responsável: ${esc(f.resp)}</em></div>`).join('')}</div></div>`;
}
function tabPage(t){
  return `<section class="page">
    <div><div class="eyebrow">Fila analisada · ${esc(t.periodo)}</div><h1>${esc(t.titulo)}</h1><p class="sub">${esc(t.escopo)}</p></div>
    ${kpis(t)}
    <div class="resumo"><div class="eyebrow">Causa raiz</div><p>${esc(t.resumo)}</p></div>
    <div class="two">${ofensores(t)}${plano(t)}</div>
    ${funnel(t)}
    ${filas(t)}
    ${casos(t)}
    ${table(t)}
    ${colabs(t)}
    ${fatores(t)}
    <p class="foot">Atenção na leitura: ${esc(t.nota)}</p>
  </section>`;
}
function delta(a,b){const d=b-a;return d? `<span class="${d>0?'up':'down'}">${d>0?'+':''}${d}</span>`:'='}
function overview(){
  const sum=i=>TABS.reduce((a,t)=>a+t.funil[i].n,0);
  const an=sum(0), it=sum(1), pr=sum(2), vd=sum(3), and=TABS.reduce((a,t)=>a+t.andamento,0);
  const comVenda=TABS.filter(t=>t.funil[3].n).map(t=>t.nome);
  const poucaProp=TABS.filter(t=>t.funil[2].n/t.funil[1].n<0.5).map(t=>t.nome);
  return `<section class="page">
    <div><div class="eyebrow">Visão geral · 7 filas · 23/10 a 09/11/2026</div><h1>Por que o cliente interessado não compra?</h1><p class="sub">Consolidado da rodada mais recente de análises de causa raiz. Cada aba traz os casos, os colaboradores e o plano de ação da fila.</p></div>
    <div class="kpis">
      <div class="kpi"><div class="eyebrow">Atendimentos analisados</div><div class="v">${an}</div><div class="d">nas 7 filas</div></div>
      <div class="kpi"><div class="eyebrow">Com interesse</div><div class="v">${it} <small>de ${an}</small></div><div class="d">${pct(it/an)} chegaram querendo comprar</div></div>
      <div class="kpi"><div class="eyebrow">Receberam proposta</div><div class="v">${pr} <small>de ${it}</small></div><div class="d">${pct(pr/it)} dos interessados</div></div>
      <div class="kpi"><div class="eyebrow">Vendas confirmadas</div><div class="v">${vd}</div><div class="d">${and} a conferir · <span class="drop">${it-vd-and} interessados sem venda</span></div></div>
    </div>
    <div class="resumo"><div class="eyebrow">Em resumo</div><p>${pct(it/an)} dos clientes queriam comprar e só ${vd} ${vd===1?'compra foi confirmada':'compras foram confirmadas'} (${comVenda.join(', ')}). Menos da metade dos interessados recebeu proposta em ${poucaProp.join(', ')}: o cliente espera, repete dados que já tinha dado ao robô ou recebe explicação no lugar do preço. Onde a proposta chega, a objeção de preço e as dúvidas de rede e carência ficam sem resposta, e o follow-up é genérico.</p></div>
    <div class="card"><h2>Mapa de ofensores por fila</h2><p class="hint">Em quantos atendimentos de cada fila o problema apareceu. Cor mais forte = mais frequente. Clique em uma fila para abrir a aba.</p>
      <div class="tbl-wrap"><table class="heat"><thead><tr><th>Fila</th>${THEMES.map(h=>`<th class="c">${esc(h)}</th>`).join('')}</tr></thead><tbody>
      ${TABS.map(t=>`<tr class="click" data-go="${t.id}" tabindex="0"><td class="fila">${esc(t.nome)}</td>${t.tema.map(c=>!c?'<td class="h c" style="color:var(--muted)">·</td>':c.semid?'<td class="h c semid" title="Citado sem caso identificado">citado</td>':heatCell(c.n/c.den,`${c.n}/${c.den}`)).join('')}</tr>`).join('')}
      </tbody></table></div>
      <div class="legend-note"><span>“·” não apontado na análise</span><span>“citado” mencionado sem caso identificado</span></div></div>
    <div class="card"><h2>Fila a fila</h2><p class="hint">Do interesse à venda nesta rodada. Em cinza, o número da rodada anterior (outubro).</p>
      <div class="tbl-wrap"><table><thead><tr><th>Fila</th><th class="c">Analisados</th><th class="c">Interesse</th><th class="c">Proposta</th><th class="c">Vendas</th><th>Causa principal</th></tr></thead><tbody>
      ${TABS.map(t=>`<tr data-go="${t.id}" tabindex="0" style="cursor:pointer"><td style="font-weight:600;white-space:nowrap">${esc(t.nome)}</td>
        <td class="c mono">${t.funil[0].n}<span class="ant">antes ${t.ant.n}</span></td><td class="c mono">${t.funil[1].n}<span class="ant">antes ${t.ant.int}</span></td>
        <td class="c mono">${t.funil[2].n}<span class="ant">antes ${t.ant.prop}</span></td><td class="c mono">${t.funil[3].n}${t.andamento?` <span style="color:var(--warn)">+${t.andamento}</span>`:''}<span class="ant">antes ${t.ant.venda}</span></td>
        <td>${esc(t.curta)}</td></tr>`).join('')}
      </tbody></table></div>
      <div class="legend-note"><span><span style="color:var(--warn)">+n</span> resultado a conferir (possível venda)</span><span>As amostras mudam de tamanho entre rodadas: compare a direção, não o número exato.</span></div></div>
    <div class="two">
      <div class="card"><h2>O que vale para todas as filas</h2><ol class="acoes">
        <li>Responder em até 2 minutos quem acabou de confirmar interesse.</li>
        <li>Continuar do ponto em que o robô parou: não pedir de novo idade, cidade ou plano já escolhido.</li>
        <li>Cliente que pede preço recebe os valores por escrito, antes de qualquer explicação longa.</li>
        <li>Na objeção de preço, perguntar quanto cabe no orçamento e oferecer alternativa.</li>
        <li>Repique e Cancelados: começar pelo motivo de não ter contratado ou de ter saído.</li>
        <li>Follow-up retoma a dúvida real (rede, carência, preço), com próximo passo e data.</li></ol></div>
      <div class="card"><h2>Fora do controle do vendedor</h2><ol class="acoes">
        <li><div><b>Distribuição e capacidade</b><div style="color:var(--ink-2);font-size:13px">Esperas de 25 min a mais de 5 h na Eugênia, 1h30 até a atribuição no Carrinho e mais de 2 h no Repique. Leads sem nenhuma resposta humana (Eugênia) e sessão encerrada sem mensagem (Repique).</div></div></li>
        <li><div><b>Triagem dos leads</b><div style="color:var(--ink-2);font-size:13px">Pós-venda, SAC e pessoas sem intenção ocupando a fila comercial: 6 de 10 no Conecta. Contato mantido mesmo após pedido de bloqueio (PME).</div></div></li>
        <li><div><b>Robô e transferências</b><div style="color:var(--ink-2);font-size:13px">O que o cliente escolheu com o robô não chega ao humano (Carrinho, Eugênia), e o robô informou que não havia plano individual na região.</div></div></li>
        <li><div><b>Produto, regras e campanhas</b><div style="color:var(--ink-2);font-size:13px">Mínimo de vidas no PME, CPF x CNPJ, região sem cobertura e pré-natal anunciado por R$ 182 fora do alcance do perfil (Adesão).</div></div></li></ol></div>
    </div>
    <p class="foot">Amostras qualitativas (10 a 21 atendimentos por fila). PME, Carrinho e Eugênia têm o mesmo cliente em mais de um histórico, e a amostra PME mistura sessões de outras filas. Use os números como sinal para orientar coaching, não como taxa de conversão da operação.</p>
  </section>`;
}
const ALL=[{id:'geral',nome:'Visão geral'},...TABS];
const nav=document.getElementById('tabs'), main=document.getElementById('main');
nav.innerHTML=ALL.map(t=>`<button class="tab" role="tab" id="tab-${t.id}" data-id="${t.id}" aria-selected="false">${esc(t.nome)}</button>`).join('');
function show(id,push){
  if(!ALL.find(t=>t.id===id)) id='geral';
  nav.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.id===id));
  main.innerHTML=id==='geral'?overview():tabPage(TABS.find(t=>t.id===id));
  if(push){try{history.replaceState(null,'','#'+id)}catch(e){} try{localStorage.setItem('cr-tab',id)}catch(e){} window.scrollTo({top:0})}
  const b=document.getElementById('tab-'+id); b&&b.scrollIntoView({block:'nearest',inline:'nearest'});
}
nav.addEventListener('click',e=>{const b=e.target.closest('.tab'); if(b) show(b.dataset.id,true)});
nav.addEventListener('keydown',e=>{if(!['ArrowRight','ArrowLeft'].includes(e.key))return;const bs=[...nav.querySelectorAll('.tab')];const i=bs.indexOf(document.activeElement);if(i<0)return;const n=bs[(i+(e.key==='ArrowRight'?1:-1)+bs.length)%bs.length];n.focus();show(n.dataset.id,true)});
main.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){show(g.dataset.go,true);return}
  const tr=e.target.closest('tr.main');if(tr){const d=tr.nextElementSibling;d.hidden=!d.hidden;tr.classList.toggle('open',!d.hidden);tr.setAttribute('aria-expanded',!d.hidden)}});
main.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const t=e.target.closest('tr.main,[data-go]');if(t){e.preventDefault();t.click()}});
let start=(location.hash||'').slice(1); if(!start){try{start=localStorage.getItem('cr-tab')||''}catch(e){}}
show(start||'geral',false);
</script>

</body>
</html>
