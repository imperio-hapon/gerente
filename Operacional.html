<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Painel de Monitorias Comerciais</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky brand bar + horizontal tab strip; each tab = summary KPIs → reading → chart + actions → case table → adjustments */
:root{
  --bg:#f5f7fa; --surface:#ffffff; --surface-2:#eef1f5; --ink:#1f2a3a; --ink-2:#4a5568; --muted:#6b7689;
  --line:#e2e6ec; --line-strong:#ccd3dd;
  --primary:#1539aa; --primary-ink:#1539aa; --primary-soft:#e4eafb; --bar-weak:#a9bbef; --heat:21,57,170;
  --brand-bar:#0f2f8f; --brand-ink:#ffffff; --brand-muted:#c2d0f6;
  --good:#157a3c; --good-soft:#e3f4e9; --bad:#b4232b; --bad-soft:#fde8e8; --warn:#8a5300; --warn-soft:#fff3d6;
  --accent-warm:#ff8800;
  --f-display:"Hanken Grotesk","Pitanga",system-ui,sans-serif;
  --f-body:"Inter","Segoe UI",system-ui,sans-serif;
  --f-mono:"Roboto Mono",ui-monospace,Menlo,monospace;
  --r:10px; --shadow:0 2px 10px -2px rgba(20,28,40,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e141e; --surface:#161f2d; --surface-2:#1d2838; --ink:#e7ecf4; --ink-2:#b4bfcf; --muted:#8c98ab;
  --line:#26324a; --line-strong:#34425c;
  --primary:#6d8fe8; --primary-ink:#9db4f2; --primary-soft:#1b2a52; --bar-weak:#3b4f86; --heat:109,143,232;
  --brand-bar:#0b1736; --brand-ink:#e7ecf4; --brand-muted:#8aa4ec;
  --good:#5cc98a; --good-soft:#123222; --bad:#f08a8f; --bad-soft:#3a1719; --warn:#f2bf55; --warn-soft:#33270d;
  --shadow:0 2px 10px -2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141e; --surface:#161f2d; --surface-2:#1d2838; --ink:#e7ecf4; --ink-2:#b4bfcf; --muted:#8c98ab;
  --line:#26324a; --line-strong:#34425c;
  --primary:#6d8fe8; --primary-ink:#9db4f2; --primary-soft:#1b2a52; --bar-weak:#3b4f86; --heat:109,143,232;
  --brand-bar:#0b1736; --brand-ink:#e7ecf4; --brand-muted:#8aa4ec;
  --good:#5cc98a; --good-soft:#123222; --bad:#f08a8f; --bad-soft:#3a1719; --warn:#f2bf55; --warn-soft:#33270d;
  --shadow:0 2px 10px -2px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--brand-bar);color:var(--brand-ink)}
.brand{max-width:1240px;margin:0 auto;padding:12px 24px 0;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand b{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:-.01em}
.brand span{color:var(--brand-muted);font-size:12px}
.tabs{max-width:1240px;margin:0 auto;padding:8px 24px 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.tab{appearance:none;border:0;background:transparent;color:var(--brand-muted);font:500 13px/1 var(--f-body);padding:11px 14px 13px;border-radius:8px 8px 0 0;white-space:nowrap;cursor:pointer;position:relative}
.tab:hover{color:var(--brand-ink);background:rgba(255,255,255,.07)}
.tab[aria-selected="true"]{background:var(--bg);color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--accent-warm);outline-offset:-2px}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent-warm);margin-left:6px;vertical-align:middle}
main{max-width:1240px;margin:0 auto;padding-inline:24px;padding-block:28px 64px}
.page{display:grid;gap:22px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:500;font-size:32px;line-height:1.15;margin:4px 0 6px;letter-spacing:-.02em;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--ink-2);max-width:78ch;margin:0}
.hint{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow);min-width:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:15px;font-weight:500;color:var(--ink-2)}
.kpi .t{font-family:var(--f-display);font-size:18px;font-weight:600;line-height:1.2;margin-top:6px}
.kpi .d{color:var(--ink-2);font-size:12.5px;margin-top:4px}
.resumo{background:var(--primary-soft);border-radius:var(--r);padding:18px 22px;display:grid;gap:6px}
.resumo p{margin:0;font-size:15.5px;line-height:1.55;max-width:95ch}
.resumo .eyebrow{color:var(--primary-ink)}
.two{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
/* bars */
.bars{display:grid;gap:14px}
.bar-row{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr) 92px;gap:14px;align-items:center}
.bar-row .lbl b{display:block;font-weight:600;font-size:13.5px}
.bar-row .lbl > span{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.track{position:relative;height:22px;background:var(--surface-2);border-radius:4px}
.fill{position:absolute;inset:0 auto 0 0;background:var(--primary);border-radius:4px}
.fill.ctx{background:var(--bar-weak)}
.fill.top{background:var(--primary)}
.ghost{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink-2);opacity:.75}
.val{text-align:right;font-variant-numeric:tabular-nums}
.val b{font-size:15px;font-family:var(--f-display)}
.val span{display:block;color:var(--muted);font-size:11.5px}
.tag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);margin-left:6px;vertical-align:1px}
.legend-note{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:14px}
.legend-note i{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
/* actions */
ol.acoes{margin:0;padding:0;list-style:none;counter-reset:a;display:grid;gap:10px}
ol.acoes li{counter-increment:a;display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start}
ol.acoes li::before{content:counter(a);width:24px;height:24px;border-radius:50%;background:var(--primary-soft);color:var(--primary-ink);font:600 12px/24px var(--f-body);text-align:center}
/* table */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
th.c,td.c{text-align:center}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr.main{cursor:pointer}
tbody tr.main:hover td{background:var(--surface-2)}
tbody tr.main:focus-visible td{outline:2px solid var(--primary);outline-offset:-2px}
tr.excl td{color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
.yes{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--bad)}
.no{display:inline-block;width:10px;height:2px;background:var(--line-strong);vertical-align:middle}
tr.excl .yes{background:var(--line-strong)}
.chip{display:inline-block;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip.perda{background:var(--bad-soft);color:var(--bad)}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.ex{background:var(--surface-2);color:var(--muted)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.flag{display:inline-block;font-size:10.5px;color:var(--warn);background:var(--warn-soft);padding:1px 6px;border-radius:4px;margin-left:6px}
tr.det td{background:var(--surface-2);padding:12px 14px 14px;color:var(--ink-2)}
tr.det p{margin:0 0 4px;max-width:110ch}
tr.det b{color:var(--ink)}
.caret{display:inline-block;transition:transform .16s;color:var(--muted);margin-right:6px}
tr.open .caret{transform:rotate(90deg)}
/* cases */
.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.case{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--surface);display:grid;gap:6px;align-content:start}
.case .h{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.case p{margin:0;color:var(--ink-2);font-size:13px}
.case .who{font-weight:600;font-size:13.5px}
/* adjust */
.ajustes{border:1px dashed var(--line-strong);border-radius:var(--r);padding:16px 20px;background:transparent}
.ajustes ul{margin:8px 0 0;padding-left:18px;display:grid;gap:6px;color:var(--ink-2)}
.ajustes li{max-width:110ch}
/* heat */
.heat td.h{text-align:center;font-variant-numeric:tabular-nums;font-weight:500;min-width:76px}
.heat td.fila{font-weight:600;white-space:nowrap}
.heat tr.click{cursor:pointer}
.heat tr.click:hover td.fila{color:var(--primary-ink);text-decoration:underline}
/* compare */
.cmp{display:grid;gap:14px}
.cmp-row{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr) 84px;gap:14px;align-items:center}
.cmp-bars{display:grid;gap:4px}
.cmp-bars .track{height:13px}
.delta{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;font-size:13px}
.delta.up{color:var(--bad)} .delta.down{color:var(--good)} .delta.na{color:var(--muted);font-weight:400}
.stack{display:flex;height:34px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surface)}
.stack div{display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;color:#fff;min-width:0}
.gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.gloss div{border-left:0;background:var(--surface-2);border-radius:8px;padding:12px 14px}
.gloss b{display:block;font-size:13.5px;margin-bottom:2px}
.gloss span{color:var(--ink-2);font-size:12.5px}
.foot{color:var(--muted);font-size:12px;max-width:100ch}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){
  main{padding-inline:16px}.brand,.tabs{padding-inline:16px}
  h1{font-size:25px}.kpi .v{font-size:23px}
  .bar-row,.cmp-row{grid-template-columns:minmax(0,1fr) 78px}
  .bar-row .lbl,.cmp-row .lbl{grid-column:1 / -1}
  .card{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

la": true, "cot": false, "fu": false, "apr": false}}, {"id": "748091096", "colab": "Giovanna Ragonezi", "obj": false, "sla": true, "cot": false, "fu": false, "apr": false, "obs": "Sessão sem mensagem do cliente e sem abordagem humana antes do encerramento.", "imp": "Lead sem conteúdo; não permite diagnóstico comercial.", "st": "Base: sem conteúdo", "inc": false, "orig": {"obj": false, "sla": true, "cot": false, "fu": false, "apr": false}}, {"id": "748086567", "colab": "Giovanna Ragonezi", "obj": true, "sla": true, "cot": false, "fu": false, "apr": false, "obs": "Cliente disse 'Não tenho interesse' e não houve abordagem humana.", "imp": "Recusa explícita sem tentativa consultiva; também houve SLA.", "st": "recusa", "inc": true, "orig": {"obj": true, "sla": true, "cot": false, "fu": false, "apr": false}}, {"id": "747881224", "colab": "Beatriz Rafaela Silvestre", "obj": false, "sla": true, "cot": false, "fu": false, "apr": false, "obs": "Cliente disse que tinha plano cancelado; recebeu carência zero, aproveitamento de carências e 50% de desconto; avançou até pagamento.", "imp": "Caso de recuperação/conversão, não de perda. Boa exploração da condição de ex-cliente.", "st": "convertido", "inc": true, "orig": {"obj": false, "sla": true, "cot": false, "fu": true, "apr": true}}, {"id": "747002475", "colab": "Thiago Abelo", "obj": false, "sla": true, "cot": false, "fu": false, "apr": false, "obs": "Cliente informou que o plano estava em dia; depois confirmou-se plano ativo há mais de 6 anos.", "imp": "Erro de base/segmentação: cliente não era cancelado.", "st": "Base: plano ativo", "inc": false, "orig": {"obj": false, "sla": true, "cot": false, "fu": false, "apr": false}}, {"id": "746788094", "colab": "Sem atendimento humano", "obj": true, "sla": false, "cot": false, "fu": false, "apr": false, "obs": "Cliente disse 'Não tenho mais interesse' e o bot encerrou.", "imp": "Recusa explícita sem atendimento humano; não há evidência para trabalhar objeção.", "st": "recusa", "inc": true, "orig": {"obj": true, "sla": false, "cot": false, "fu": false, "apr": false}}, {"id": "745913528", "colab": "Sem atendimento humano", "obj": true, "sla": false, "cot": false, "fu": false, "apr": false, "obs": "Cliente disse 'Não tenho interesse!' e o bot encerrou.", "imp": "Recusa explícita sem atendimento humano.", "st": "recusa", "inc": true, "orig": {"obj": true, "sla": false, "cot": false, "fu": false, "apr": false}}, {"id": "745716740", "colab": "Sem atendimento humano", "obj": true, "sla": false, "cot": false, "fu": false, "apr": false, "obs": "Cliente disse 'Não tenho interesse' e o bot encerrou.", "imp": "Recusa explícita sem atendimento humano.", "st": "recusa", "inc": true, "orig": {"obj": true, "sla": false, "cot": false, "fu": false, "apr": false}}, {"id": "743550440", "colab": "Beatriz Rafaela Silvestre", "obj": true, "sla": false, "cot": false, "fu": false, "apr": false, "obs": "Contato era profissional de imóveis e reclamou que não solicitou abordagem, ameaçando processo.", "imp": "Erro de base/consentimento; não é oportunidade comercial válida.", "st": "Base: contato indevido", "inc": false, "orig": {"obj": true, "sla": false, "cot": false, "fu": false, "apr": false}}], "resumo": "O problema principal desta fila é a qualidade da lista de contatos, e não a abordagem. 4 dos 10 registros não deveriam estar lá (spam, conversa vazia, cliente com plano ativo e pessoa que não pediu contato). Dos 6 restantes, 5 recusaram logo de início e 1 voltou a ser cliente.", "composicao": true, "plano": ["Limpar a lista antes de distribuir: tirar spam, contatos sem conversa e clientes com plano ativo.", "Criar um motivo de descarte \"não solicitei contato\" para registrar e bloquear esses casos.", "Na recusa explícita, fazer no máximo uma pergunta consultiva e respeitar a resposta.", "Garantir atendimento humano antes do encerramento: 3 recusas foram encerradas só pelo robô.", "Para ex-clientes reais, usar carência aproveitada e desconto como argumento e conduzir direto ao fechamento (modelo do caso 747881224)."]}, {"id": "carrinho", "nome": "Carrinho", "titulo": "Carrinho (PF)", "oque": "Pessoas físicas que começaram a contratação no site e pararam no meio. São os leads mais quentes: já escolheram ou simularam um plano.", "rows": [{"id": "747721905", "colab": "Isabella Mattos", "obj": false, "sla": true, "cot": true, "fu": true, "apr": false, "obs": "Cliente declarou interesse e pediu as duas modalidades. Após o pedido, houve longa espera até a cotação. A venda ficou em apresentação de opções, sem recomendação objetiva baseada no perfil.", "imp": "Lead ativo perdeu ritmo no momento da cotação; oportunidade de recomendar e conduzir a escolha.", "st": "perda", "inc": true, "orig": {"obj": false, "sla": true, "cot": true, "fu": true, "apr": false}}, {"id": "747822042", "colab": "Julia Silva", "obj": false, "sla": true, "cot": true, "fu": true, "apr": true, "obs": "Cliente já entrou dizendo que tinha interesse/ativação. A abordagem voltou para confirmação de plano novo, cidade e idade; depois foram apresentadas modalidades. Houve SLA.", "imp": "Lead aquecido voltou para descoberta básica; risco de perda de continuidade e esfriamento.", "st": "perda", "inc": true, "orig": {"obj": false, "sla": true, "cot": true, "fu": true, "apr": true}}, {"id": "747959562", "colab": "Helena Ribeiro", "obj": false, "sla": false, "cot": true, "fu": true, "apr": false, "obs": "Cliente recebeu todas as opções, pediu um momento para avaliar e depois recebeu follow-up genérico perguntando se havia dúvida ou se queria contratar.", "imp": "A decisão permaneceu com o cliente; faltou recomendação e retomada ligada à opção mais adequada.", "st": "perda", "inc": true, "orig": {"obj": false, "sla": false, "cot": true, "fu": true, "apr": false}}, {"id": "746780432", "colab": "Robson Ferrari", "obj": true, "sla": true, "cot": true, "fu": true, "apr": false, "obs": "Cliente escolheu plano completo e perguntou especificamente a diferença entre coparticipação total e parcial. Houve resposta por áudio; follow-up do dia seguinte voltou genérico para promoção/dúvida.", "imp": "Barreira específica de produto não foi usada como eixo da retomada e do fechamento.", "st": "perda", "inc": true, "orig": {"obj": true, "sla": true, "cot": true, "fu": true, "apr": false}}, {"id": "744821655", "colab": "Isabella Mattos", "obj": true, "sla": false, "cot": true, "fu": true, "apr": false, "obs": "Cliente informou bebê de 12 dias e pediu cobertura completa, sem odontológico, com exames e internações. O contexto mostra preferência explícita que deveria virar recomendação simples e direcionada.", "imp": "Necessidade muito clara; oportunidade de reduzir opções e recomendar diretamente o produto aderente.", "st": "perda", "inc": true, "orig": {"obj": true, "sla": false, "cot": true, "fu": true, "apr": false}}], "resumo": "Em todos os 5 atendimentos o promotor enviou opções e preços, mas deixou o cliente decidir sozinho, e a retomada foi genérica. O cliente do Carrinho já chega com intenção de compra; o que falta é recomendar um plano e pedir o fechamento.", "principalNota": "Empate: \"Cotando mais do que recomendando\" e \"Follow-up\" aparecem nos 5 atendimentos.", "plano": ["Tratar o lead de Carrinho como oportunidade aquecida, com prioridade de resposta.", "Depois de apresentar valores, recomendar uma opção e justificar.", "Se o cliente escolheu modalidade ou disse a preferência, seguir direto para o fechamento.", "Follow-up deve retomar a última pergunta ou barreira do cliente.", "Perguntas sobre coparticipação, rede ou preço devem terminar em nova tentativa de fechamento.", "Usar o que o cliente já informou para não reiniciar a conversa."]}, {"id": "pme", "nome": "PME", "titulo": "PME", "oque": "Planos empresariais para pequenas e médias empresas (contratação via CNPJ).", "rows": [{"id": "748026813", "colab": "Aline Gunello", "obj": false, "sla": true, "cot": false, "fu": false, "apr": false, "obs": "Cliente apresentou dúvidas sobre valores de consultas/exames e região de atendimento. Houve SLA, mas Aline manteve retomadas e chegou a investigar qual ponto impedia a finalização.", "imp": "Benchmark parcial de follow-up: investigação da barreira decisória, embora pudesse ocorrer mais cedo.", "st": "benchmark", "inc": true, "orig": {"obj": false, "sla": true, "cot": false, "fu": false, "apr": false}}, {"id": "748075696", "colab": "Luan Ribeiro", "obj": true, "sla": false, "cot": true, "fu": true, "apr": false, "obs": "Cliente declarou que o valor ficava bem acima do que paga hoje. A resposta foi 'aaah que pena', sem investigar quanto paga, teto de investimento, alternativa ou contraproposta.", "imp": "Perda direta de oportunidade: objeção explícita de preço não virou negociação nem retomada.", "st": "perda", "inc": true, "orig": {"obj": true, "sla": false, "cot": true, "fu": true, "apr": false}}, {"id": "747691729", "colab": "Julia Silva", "obj": true, "sla": true, "cot": true, "fu": true, "apr": false, "obs": "Cliente informou três vidas, idades e contratação por CNPJ; após receber opções perguntou sobre plano sem coparticipação. Houve resposta por áudio, mas não há evidência de condução posterior para decisão/fechamento.", "imp": "Oportunidade em recomendação e follow-up após dúvida específica de produto/coparticipação.", "st": "perda", "inc": true, "orig": {"obj": true, "sla": true, "cot": true, "fu": true, "apr": false}}], "resumo": "Os clientes PME não estão sem interesse: eles dizem claramente o que os impede (preço, coparticipação). A venda se perde quando essa barreira não vira negociação. O caso de Luan (748075696) é o mais crítico: o cliente disse que estava caro e a resposta foi \"que pena\", sem nenhuma contraproposta.", "principalNota": "Empate: Objeção, SLA, Cotação sem recomendação e Follow-up aparecem em 2 de 3 atendimentos cada.", "plano": ["Quando o cliente disser que está caro, perguntar quanto paga hoje e qual valor cabe no orçamento.", "Após a cotação, recomendar uma opção e explicar por que ela é a mais adequada.", "O follow-up deve citar a última barreira apresentada pelo cliente.", "Dúvidas de coparticipação, rede ou cobertura devem terminar com uma nova tentativa de fechamento.", "Replicar mais cedo na conversa a investigação da barreira feita por Aline (748026813)."]}, {"id": "eugenia", "nome": "Eugênia", "titulo": "Eugênia · Cotação · Seller", "oque": "Atendimentos que começam com a assistente virtual Eugênia e passam para um promotor humano. São três filas: Eugênia, Eugênia Cotação e Eugênia Seller.", "extraCol": "Fila", "rows": [{"id": "748960249", "colab": "Andrezza Machini", "extra": "Eugênia", "obj": true, "sla": true, "cot": false, "fu": true, "apr": true, "obs": "Necessidade crítica de hemodiálise já informada; retomada genérica sem trabalhar a necessidade.", "st": "perda", "inc": true, "orig": {"obj": true, "sla": true, "cot": false, "fu": true, "apr": true}}, {"id": "748112354", "colab": "Andrezza Machini", "extra": "Eugênia", "obj": true, "sla": false, "cot": false, "fu": true, "apr": true, "obs": "Dúvida sobre cirurgia reparadora; follow-up posterior não respondeu diretamente à barreira.", "st": "perda", "inc": true, "orig": {"obj": true, "sla": false, "cot": false, "fu": true, "apr": true}}, {"id": "745557827", "colab": "Jady Queiroz", "extra": "Eugênia", "obj": false, "sla": false, "cot": false, "fu": false, "apr": false, "obs": "Benchmark positivo: continuidade até documentação, contratação e boas-vindas.", "st": "convertido", "inc": true, "orig": {"obj": false, "sla": false, "cot": false, "fu": false, "apr": false}}, {"id": "EUG-ATUAL-04", "colab": "Promotor(a) monitorado(a)", "extra": "Eugênia", "obj": false, "sla": true, "cot": true, "fu": true, "apr": true, "obs": "Oportunidade de continuidade: cotação e retomada sem transformar contexto anterior em recomendação objetiva.", "st": "perda", "inc": true, "orig": {"obj": false, "sla": true, "cot": true, "fu": true, "apr": true}, "flag": "ID provisório"}, {"id": "EUG-ATUAL-05", "colab": "Promotor(a) monitorado(a)", "extra": "Eugênia", "obj": true, "sla": true, "cot": true, "fu": true, "apr": false, "obs": "Objeção presente e necessidade de condução mais consultiva para fechamento.", "st": "perda", "inc": true, "orig": {"obj": true, "sla": true, "cot": true, "fu": true, "apr": false}, "flag": "ID provisório"}, {"id": "747610569", "colab": "Kamila Oliveira", "extra": "Eugênia Cotação", "obj": true, "sla": true, "cot": false, "fu": true, "apr": true, "obs": "Dúvida objetiva sobre rede Bresser/Mooca; houve SLA e retomada posterior sem responder diretamente à barreira.", "st": "perda", "inc": true, "orig": {"obj": true, "sla": true, "cot": false, "fu": true, "apr": true}}, {"id": "747023047", "colab": "Raiane Lima", "extra": "Eugênia Cotação", "obj": false, "sla": true, "cot": false, "fu": true, "apr": false, "obs": "Cliente disse 'SIM, VAMOS SEGUIR', enviou documentos e depois desistiu; SLA em etapa avançada.", "st": "perda", "inc": true, "orig": {"obj": false, "sla": true, "cot": false, "fu": true, "apr": false}}, {"id": "COT-ATUAL-03", "colab": "Promotor(a) monitorado(a)", "extra": "Eugênia Cotação", "obj": true, "sla": true, "cot": true, "fu": true, "apr": true, "obs": "Barreira clara; oportunidade de usar histórico e recomendar solução específica.", "st": "perda", "inc": true, "orig": {"obj": true, "sla": true, "cot": true, "fu": true, "apr": true}, "flag": "ID provisório"}, {"id": "COT-ATUAL-04", "colab": "Promotor(a) monitorado(a)", "extra": "Eugênia Cotação", "obj": false, "sla": true, "cot": true, "fu": true, "apr": true, "obs": "Cotação apresentada, porém retomada com pouca continuidade do contexto anterior.", "st": "perda", "inc": true, "orig": {"obj": false, "sla": true, "cot": true, "fu": true, "apr": true}, "flag": "ID provisório"}, {"id": "COT-ATUAL-05", "colab": "Promotor(a) monitorado(a)", "extra": "Eugênia Cotação", "obj": true, "sla": false, "cot": true, "fu": true, "apr": false, "obs": "Oportunidade em objeção, recomendação e follow-up direcionado.", "st": "perda", "inc": true, "orig": {"obj": true, "sla": false, "cot": true, "fu": true, "apr": false}, "flag": "ID provisório"}, {"id": "743293578", "colab": "Sofia Lunga", "extra": "Eugênia Seller", "obj": true, "sla": true, "cot": false, "fu": true, "apr": true, "obs": "Cliente queria fechar no dia; dúvida de coparticipação teve SLA e depois follow-ups genéricos.", "st": "perda", "inc": true, "orig": {"obj": true, "sla": true, "cot": false, "fu": true, "apr": true}}, {"id": "747646100", "colab": "Sofia Lunga", "extra": "Eugênia Seller", "obj": false, "sla": true, "cot": false, "fu": false, "apr": false, "obs": "Benchmark positivo de fechamento; escolha, documentos, pagamento/ativação e boas-vindas; atenção ao SLA.", "st": "convertido", "inc": true, "orig": {"obj": false, "sla": true, "cot": false, "fu": false, "apr": false}}, {"id": "743276475", "colab": "Carolina Ribeiro", "extra": "Eugênia Seller", "obj": true, "sla": true, "cot": false, "fu": true, "apr": false, "obs": "Cliente iniciou contratação; houve SLA e retomada genérica sobre o que não agradou.", "st": "perda", "inc": true, "orig": {"obj": true, "sla": true, "cot": false, "fu": true, "apr": false}}, {"id": "744335026", "colab": "Thaisa Almeida", "extra": "Eugênia Seller", "obj": false, "sla": true, "cot": false, "fu": true, "apr": true, "obs": "Plano escolhido e pedido de atendente; transferência humana demorou e retomada posterior foi genérica.", "st": "perda", "inc": true, "orig": {"obj": false, "sla": true, "cot": false, "fu": true, "apr": true}}, {"id": "743217532", "colab": "Kamila Oliveira", "extra": "Eugênia Seller", "obj": true, "sla": true, "cot": true, "fu": true, "apr": true, "obs": "Cliente interessada comparando coparticipação; dúvidas e esperas durante a negociação.", "st": "perda", "inc": true, "orig": {"obj": true, "sla": true, "cot": true, "fu": true, "apr": true}}, {"id": "743241794", "colab": "Sofia Lunga", "extra": "Eugênia Seller", "obj": true, "sla": true, "cot": false, "fu": true, "apr": true, "obs": "Cliente comparava com Bluemed sem coparticipação; barreira conhecida deveria orientar follow-up.", "st": "perda", "inc": true, "orig": {"obj": true, "sla": true, "cot": false, "fu": true, "apr": true}}, {"id": "742791427", "colab": "Promotor(a) Seller", "extra": "Eugênia Seller", "obj": false, "sla": false, "cot": false, "fu": false, "apr": false, "obs": "Bot recomendou plano completo e cliente manifestou intenção de se organizar para contratar.", "st": "benchmark", "inc": true, "orig": {"obj": false, "sla": false, "cot": false, "fu": false, "apr": false}, "flag": "Sem colaborador"}, {"id": "740024567", "colab": "Promotor(a) Seller", "extra": "Eugênia Seller", "obj": true, "sla": false, "cot": false, "fu": false, "apr": false, "obs": "Cliente avançou para fechamento esclarecendo parcela e carência; boa condução de dúvidas.", "st": "benchmark", "inc": true, "orig": {"obj": true, "sla": false, "cot": false, "fu": false, "apr": false}, "flag": "Sem colaborador"}, {"id": "746513587", "colab": "Jady Queiroz", "extra": "Eugênia Seller", "obj": false, "sla": true, "cot": false, "fu": false, "apr": false, "obs": "Cliente desistiu antes da atuação humana; SLA não deve ter o mesmo peso de perda comercial.", "st": "perda", "inc": true, "orig": {"obj": false, "sla": true, "cot": false, "fu": false, "apr": false}}, {"id": "SELL-ATUAL-10", "colab": "Promotor(a) Seller", "extra": "Eugênia Seller", "obj": false, "sla": true, "cot": true, "fu": true, "apr": true, "obs": "Oportunidade em continuidade bot-humano e recomendação.", "st": "perda", "inc": true, "orig": {"obj": false, "sla": true, "cot": true, "fu": true, "apr": true}, "flag": "ID provisório"}, {"id": "SELL-ATUAL-11", "colab": "Promotor(a) Seller", "extra": "Eugênia Seller", "obj": true, "sla": false, "cot": true, "fu": true, "apr": false, "obs": "Objeção conhecida; retomada deveria trabalhar diretamente a barreira.", "st": "perda", "inc": true, "orig": {"obj": true, "sla": false, "cot": true, "fu": true, "apr": false}, "flag": "ID provisório"}, {"id": "SELL-ATUAL-12", "colab": "Promotor(a) Seller", "extra": "Eugênia Seller", "obj": false, "sla": true, "cot": false, "fu": true, "apr": true, "obs": "Histórico disponível, mas retomada sem continuidade suficiente para fechamento.", "st": "perda", "inc": true, "orig": {"obj": false, "sla": true, "cot": false, "fu": true, "apr": true}, "flag": "ID provisório"}], "resumo": "A Eugênia (robô) identifica a necessidade e aquece o cliente, mas na passagem para o atendimento humano o contexto se perde: há demora, a conversa recomeça e a retomada é genérica. Follow-up aparece em 77% dos atendimentos e subiu 27 pontos desde 28/09.", "comparativo": {"label": "28/09", "base": 22, "vals": {"apr": 0.5909090909090909, "sla": 0.5909090909090909, "cot": 0.5, "fu": 0.5, "obj": 0.45454545454545453}}, "porFila": true, "plano": ["Antes da primeira mensagem humana, ler o que a Eugênia já levantou: necessidade, opções, valores e última objeção.", "Prioridade máxima para quem diz 'vamos seguir', pede atendente, envia documentos ou pergunta sobre pagamento.", "O follow-up deve citar a última barreira do cliente.", "Toda cotação termina com uma recomendação.", "Objeções (preço, coparticipação, rede, carência) geram negociação específica.", "Acompanhar o SLA principalmente nos leads aquecidos e na transferência robô → humano."]}, {"id": "repme", "nome": "Repique PME", "titulo": "Repique PME", "oque": "Nova tentativa de venda para empresas que já demonstraram interesse antes e não fecharam.", "rows": [{"id": "748041551", "colab": "Kamila Kuner", "obj": true, "sla": true, "cot": true, "fu": true, "apr": false, "obs": "Cliente recebeu duas opções, questionou desconto e disse que o valor estava 'um pouco salgado'. Depois informou que ficou fora do orçamento. Houve tentativa de alternativa, mas faltou investigar teto de investimento e retomar especificamente a objeção financeira no follow-up.", "res": "Não converteu", "st": "perda", "inc": true, "orig": {"obj": true, "sla": true, "cot": true, "fu": true, "apr": false}}, {"id": "748034595", "colab": "Kamila Kuner", "obj": false, "sla": true, "cot": false, "fu": false, "apr": false, "obs": "Cliente informou que já possuía plano e que não havia entendido a mensagem. O atendimento foi encerrado poucos minutos depois. Não há evidência suficiente de oportunidade comercial real após a manifestação de que já tinha plano.", "res": "Sem oportunidade comercial clara", "st": "Sem oportunidade", "inc": false, "orig": {"obj": false, "sla": true, "cot": false, "fu": false, "apr": false}}, {"id": "725112362", "colab": "Beatriz Braido", "obj": true, "sla": true, "cot": true, "fu": false, "apr": false, "obs": "Cliente entrou com intenção explícita de fechar. Beatriz investigou necessidade, apresentou opções e conduziu até documentos, pagamento e boas-vindas. Houve SLA e, quando a cliente pediu opção mais barata, a recomendação poderia ter sido mais assertiva; ainda assim, é o benchmark positivo da amostra.", "res": "Converteu", "st": "convertido", "inc": true, "orig": {"obj": true, "sla": true, "cot": true, "fu": false, "apr": false}}, {"id": "723172479", "colab": "Felipe Alves de Souza", "obj": false, "sla": true, "cot": false, "fu": true, "apr": false, "obs": "Cliente pediu atendente à noite; a abordagem humana ocorreu apenas na manhã seguinte. Sem resposta, o atendimento foi encerrado. Oportunidade de melhorar tempo de resposta e criar uma régua de recuperação antes do encerramento.", "res": "Não converteu", "st": "perda", "inc": true, "orig": {"obj": false, "sla": true, "cot": false, "fu": true, "apr": false}}, {"id": "721163813", "colab": "Felipe Alves de Souza", "obj": false, "sla": true, "cot": false, "fu": true, "apr": true, "obs": "Cliente enviou CNPJ e nome. A primeira abordagem ocorreu cerca de duas horas depois e pediu novamente cidade, idade e CPF/CNPJ. Dois dias depois houve retomada genérica perguntando como preferia dar seguimento. Faltou aproveitar as informações já disponíveis e construir follow-up específico.", "res": "Não converteu", "st": "perda", "inc": true, "orig": {"obj": false, "sla": true, "cot": false, "fu": true, "apr": true}}], "resumo": "De 4 oportunidades reais, 1 virou venda (25%). Nos casos sem venda, a perda vem da retomada: demora para assumir, pedir de novo dados que o cliente já enviou e follow-up genérico. O atendimento 725112362 (Beatriz Braido) é o modelo a seguir: foi da intenção ao pagamento.", "conversao": true, "plano": ["Cuidar do tempo de resposta, principalmente na primeira retomada.", "Antes de abordar, ler CNPJ, número de vidas, produto e barreira já registrados.", "Evitar follow-up genérico quando já existe objeção conhecida: retomar preço, produto ou pendência.", "Na objeção de preço, perguntar qual valor cabe no orçamento antes de oferecer outra opção.", "Usar o atendimento 725112362 como exemplo de condução até o fechamento."]}, {"id": "repf", "nome": "Repique PF", "titulo": "Repique PF", "oque": "Nova tentativa de venda para pessoas físicas que já conversaram antes e não fecharam.", "rows": [{"id": "750519434", "colab": "Gabriela Reis", "obj": false, "sla": true, "cot": true, "fu": true, "apr": false, "obs": "Cliente recebeu cotação CNPJ e ficou analisando. Faltou identificar a barreira decisória, recomendar objetivamente e conduzir para fechamento.", "st": "perda", "inc": true, "orig": {"obj": false, "sla": true, "cot": true, "fu": true, "apr": false}}, {"id": "747107939", "colab": "Felipe Alves de Souza", "obj": true, "sla": true, "cot": true, "fu": true, "apr": false, "obs": "Cliente escolheu o tipo de plano e recebeu valor para três vidas. Após pergunta sobre orçamento, não houve negociação estruturada da barreira financeira.", "st": "perda", "inc": true, "orig": {"obj": true, "sla": true, "cot": true, "fu": true, "apr": false}}, {"id": "743702080", "colab": "Luana Ribeiro", "obj": false, "sla": true, "cot": false, "fu": true, "apr": false, "obs": 4", "colab": "Felipe Alves de Souza", "obj": true, "sla": false, "cot": false, "fu": true, "apr": false, "obs": "Oportunidade em objeção e fechamento: a retomada não evoluiu para negociação suficientemente específica da barreira apresentada.", "st": "perda", "inc": true, "orig": {"obj": true, "sla": false, "cot": false, "fu": true, "apr": false}, "flag": "Verificar ID"}], "resumo": "O Repique consegue reabrir a conversa, mas nem sempre recupera a venda. Em 13 de 14 atendimentos a retomada foi genérica, sem voltar ao motivo que impediu a compra anterior (preço alto, querer reativar o plano antigo, rejeitar coparticipação). O SLA piorou bastante em relação à semana anterior.", "comparativo": {"label": "Semana anterior", "base": 3, "vals": {"apr": 1.0, "cot": 0.6666666666666666, "obj": 0.6666666666666666, "sla": 0.3333333333333333}}, "planilha": {"obj": 0.35714285714285715, "cot": 0.42857142857142855, "apr": 0.35714285714285715}, "plano": ["Antes de abordar, achar no histórico o produto e valor apresentados e o motivo de não ter fechado.", "O follow-up retoma a última barreira, e não apenas pergunta se ainda há interesse.", "Depois de cotar, recomendar uma opção e justificar.", "Toda objeção de preço leva a perguntar o teto de investimento e oferecer alternativa.", "Criar uma régua mínima de tentativas antes de encerrar clientes sem resposta.", "Reduzir o tempo de resposta, que piorou 38 pontos em relação à semana anterior."]}, {"id": "adesao", "nome": "Adesão", "titulo": "Adesão", "oque": "Planos coletivos por adesão, contratados por meio de entidades de classe ou associações.", "extraCol": null, "rows": [{"id": "747866319", "colab": "Beatriz Rafaela Silvestre", "obj": false, "sla": false, "cot": false, "fu": true, "apr": false, "obs": "Cliente não respondeu à descoberta inicial e depois marcou 'Não tenho interesse'.", "imp": "Baixa ativação inicial; retomada automatizada sem diagnóstico.", "st": "perda", "inc": true, "orig": {"obj": false, "sla": false, "cot": false, "fu": true, "apr": false}}, {"id": "747683475", "colab": "Raissa Burin", "obj": false, "sla": true, "cot": false, "fu": false, "apr": true, "obs": "Pós-venda/dúvida de boleto; não é caso de não venda.", "imp": "Atendimento de suporte, fora do diagnóstico de perda comercial.", "st": "Suporte pós-venda", "inc": false, "orig": {"obj": false, "sla": true, "cot": false, "fu": false, "apr": true}}, {"id": "747604011", "colab": "Beatriz Rafaela Silvestre", "obj": false, "sla": true, "cot": true, "fu": true, "apr": false, "obs": "Cliente pediu os dois planos; recebeu resposta por áudio e depois desistiu.", "imp": "Cotação sem recomendação visível e sem retomada consultiva.", "st": "perda", "inc": true, "orig": {"obj": false, "sla": true, "cot": true, "fu": true, "apr": false}}, {"id": "747020029", "colab": "Thiago Abelo", "obj": false, "sla": true, "cot": false, "fu": true, "apr": true, "obs": "Cliente queria seguir sem CNPJ, mas Jataí não tinha comercialização; foram feitos follow-ups.", "imp": "Restrição geográfica; follow-up existiu, mas sem alternativa concreta visível.", "st": "perda", "inc": true, "orig": {"obj": false, "sla": true, "cot": false, "fu": true, "apr": true}}, {"id": "746814561", "colab": "Giovanna Ragonezi", "obj": true, "sla": true, "cot": true, "fu": true, "apr": true, "obs": "Cliente perguntou por opção sem odonto; resposta veio depois por áudio e follow-up genérico.", "imp": "Objeção/preferência específica não virou recomendação objetiva.", "st": "perda", "inc": true, "orig": {"obj": true, "sla": true, "cot": true, "fu": true, "apr": true}}, {"id": "746541603", "colab": "Raissa Burin", "obj": true, "sla": true, "cot": false, "fu": true, "apr": true, "obs": "Cliente queria obstetrícia sem coparticipação e estava grávida; carência para parto inviabilizou uso esperado.", "imp": "Objeção de carência/obstetrícia determinante; SLA agravou jornada.", "st": "perda", "inc": true, "orig": {"obj": true, "sla": true, "cot": false, "fu": true, "apr": true}}, {"id": "745424748", "colab": "Giovanna Ragonezi", "obj": true, "sla": true, "cot": true, "fu": true, "apr": true, "obs": "Cliente perguntou carência e carência para parto; follow-ups posteriores destacaram carência zero genérica.", "imp": "Barreira específica de parto não foi retomada de forma personalizada.", "st": "perda", "inc": true, "orig": {"obj": true, "sla": true, "cot": true, "fu": true, "apr": true}}, {"id": "745292346", "colab": "Giovanna Ragonezi", "obj": false, "sla": true, "cot": true, "fu": true, "apr": true, "obs": "Cliente demonstrou interesse várias vezes, avançou para escolha de valor/documentos e depois repetiu que não tinha interesse.", "imp": "Lead quente esfriou ao longo de uma jornada com vários SLAs e retomadas.", "st": "perda", "inc": true, "orig": {"obj": false, "sla": true, "cot": true, "fu": true, "apr": true}}, {"id": "744523987", "colab": "Raissa Burin", "obj": false, "sla": true, "cot": false, "fu": false, "apr": true, "obs": "Cliente efetivamente contratou e depois recebeu suporte de acesso/app.", "imp": "Não classificar como não venda; caso de conversão/suporte.", "st": "convertido", "inc": false, "orig": {"obj": false, "sla": true, "cot": false, "fu": false, "apr": true}}, {"id": "744399129", "colab": "Thiago Abelo", "obj": true, "sla": true, "cot": true, "fu": true, "apr": true, "obs": "Cliente era primeira contratação, perguntou sobre descontos/rede e disse que iria avaliar.", "imp": "Follow-up não retomou a dúvida central nem trouxe recomendação final.", "st": "perda", "inc": true, "orig": {"obj": true, "sla": true, "cot": true, "fu": true, "apr": true}}], "resumo": "Considerando só os 8 atendimentos realmente comerciais, o follow-up falhou em todos: a retomada não voltou à dúvida real do cliente (carência para parto, opção sem odonto, desconto). A demora aparece em 7 de 8 e agrava a perda de leads que já estavam avançados.", "plano": ["Separar a fila comercial de Adesão dos atendimentos de pós-venda (boleto, acesso ao app).", "Priorizar leads que já disseram 'tenho interesse'.", "Recomendar uma opção depois de entender o uso e a necessidade do cliente.", "Retomar exatamente a última dúvida do cliente no follow-up.", "Tratar carência e obstetrícia de forma específica antes de insistir em benefícios genéricos.", "Reduzir o tempo de resposta durante a negociação."]}];
const OF = [
  {k:'obj', nome:'Objeção não tratada', curto:'Objeção', desc:'O cliente disse o que o impedia (preço, carência, coparticipação) e isso não virou negociação.'},
  {k:'sla', nome:'Demora no atendimento (SLA)', curto:'SLA', desc:'Tempo de resposta acima do limite. Agrava a perda, mas raramente explica sozinho.'},
  {k:'cot', nome:'Cotou sem recomendar', curto:'Cotou s/ recom.', desc:'Enviou opções e preços, mas não indicou qual plano é o melhor para o cliente.'},
  {k:'fu',  nome:'Retomada fraca (follow-up)', curto:'Follow-up', desc:'A volta ao cliente não aconteceu ou foi genérica, sem retomar a dúvida dele.'},
  {k:'apr', nome:'Não usou o que o cliente já disse', curto:'Histórico', desc:'Pediu de novo dados já informados ou ignorou o histórico da conversa.'},
];
const ofBy = Object.fromEntries(OF.map(o=>[o.k,o]));
const pct = (x,d=1)=> (x*100).toLocaleString('pt-BR',{minimumFractionDigits:x*100%1===0?0:d,maximumFractionDigits:d})+'%';
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---- compute stats per tab
TABS.forEach(t=>{
  const inc = t.rows.filter(r=>r.inc);
  t.n = inc.length; t.total = t.rows.length;
  t.cnt = {}; t.pct = {}; t.orig = {};
  OF.forEach(o=>{
    t.cnt[o.k] = inc.filter(r=>r[o.k]).length;
    t.pct[o.k] = t.n ? t.cnt[o.k]/t.n : 0;
    t.orig[o.k] = (t.planilha && t.planilha[o.k]!=null) ? t.planilha[o.k] : t.rows.filter(r=>r.orig[o.k]).length/t.total;
  });
  const com = OF.filter(o=>o.k!=='sla');
  const mx = Math.max(...com.map(o=>t.cnt[o.k]));
  t.top = com.filter(o=>t.cnt[o.k]===mx);
  t.conv = t.rows.filter(r=>r.st==='convertido').length;
});

// ---- render helpers
function statusChip(r){
  if(r.st==='convertido') return '<span class="chip ok">Converteu</span>';
  if(r.st==='benchmark') return '<span class="chip ok">Boa prática</span>';
  if(r.st==='recusa') return '<span class="chip warn">Recusa explícita</span>';
  if(!r.inc) return `<span class="chip ex">Fora do cálculo · ${esc(r.st)}</span>`;
  return '<span class="chip perda">Não converteu</span>';
}
function kpis(t){
  const topNames = t.top.length>1 ? `Empate (${t.top.length})` : t.top[0].nome;
  const topSub = t.top.length>1 ? t.top.map(o=>o.curto).join(', ') : '';
  const topCnt = t.cnt[t.top[0].k];
  let res;
  if(t.id==='cancelados'){
    const err = t.rows.filter(r=>!r.inc).length;
    res = `<div class="kpi"><div class="eyebrow">Erro na lista de contatos</div><div class="v">${err} <small>de ${t.total}</small></div><div class="d">registros que não eram oportunidade real</div></div>`;
  } else if(t.conversao){
    res = `<div class="kpi"><div class="eyebrow">Conversão observada</div><div class="v">${pct(t.conv/t.n)}</div><div class="d">${t.conv} venda em ${t.n} oportunidades</div></div>`;
  } else {
    res = `<div class="kpi"><div class="eyebrow">Vendas na amostra</div><div class="v">${t.conv} <small>de ${t.total}</small></div><div class="d">${t.conv? 'atendimentos que converteram' : 'amostra só com casos de não venda'}</div></div>`;
  }
  return `<div class="kpis">
    <div class="kpi"><div class="eyebrow">Atendimentos analisados</div><div class="v">${t.n}${t.n!==t.total?` <small>de ${t.total}</small>`:''}</div><div class="d">${t.n!==t.total? `${t.total-t.n} fora do cálculo (não eram venda)` : 'todos com oportunidade comercial'}</div></div>
    <div class="kpi"><div class="eyebrow">Principal ponto de perda</div><div class="t">${esc(topNames)}</div><div class="d">${topSub?esc(topSub)+' · ':''}${topCnt} de ${t.n} · ${pct(topCnt/t.n)}</div></div>
    <div class="kpi"><div class="eyebrow">Demora (SLA)</div><div class="v">${pct(t.pct.sla)}</div><div class="d">${t.cnt.sla} de ${t.n} atendimentos com atraso</div></div>
    ${res}
  </div>`;
}
function bars(t){
  const order = [...OF].sort((a,b)=>t.cnt[b.k]-t.cnt[a.k] || (a.k==='sla') - (b.k==='sla'));
  const hasGhost = order.some(o=>Math.abs(t.orig[o.k]-t.pct[o.k])>0.001);
  const topSet = new Set(t.top.map(o=>o.k));
  return `<div class="bars">${order.map(o=>{
    const diff = Math.abs(t.orig[o.k]-t.pct[o.k])>0.001;
    return `<div class="bar-row" title="${esc(o.nome)}: ${t.cnt[o.k]} de ${t.n} (${pct(t.pct[o.k])})">
      <div class="lbl"><b>${esc(o.nome)}${o.k==='sla'?'<span class="tag">contexto</span>':''}${topSet.has(o.k)&&t.cnt[o.k]>0?'<span class="tag" style="background:var(--primary-soft);color:var(--primary-ink)">principal</span>':''}</b><span>${esc(o.desc)}</span></div>
      <div class="track"><div class="fill ${o.k==='sla'?'ctx':''}" style="width:${t.pct[o.k]*100}%"></div>${diff?`<div class="ghost" style="left:calc(${t.orig[o.k]*100}% - 1px)"></div>`:''}</div>
      <div class="val"><b>${pct(t.pct[o.k])}</b><span>${t.cnt[o.k]} de ${t.n}${diff?` · planilha ${pct(t.orig[o.k])}`:''}</span></div>
    </div>`}).join('')}</div>
    <div class="legend-note"><span><i style="background:var(--primary)"></i>Ponto comercial</span><span><i style="background:var(--bar-weak)"></i>SLA (contexto operacional)</span>${hasGhost?'<span><i style="background:var(--ink-2);width:2px;height:12px"></i>Valor que estava na planilha original</span>':''}</div>`;
}
function table(t){
  const ex = t.extraCol;
  return `<div class="tbl-wrap"><table>
    <thead><tr><th>ID</th><th>Colaborador</th>${ex?`<th>${ex}</th>`:''}${OF.map(o=>`<th class="c" title="${esc(o.nome)}">${esc(o.curto)}</th>`).join('')}<th>Situação</th></tr></thead>
    <tbody>${t.rows.map((r,i)=>`
      <tr class="main ${r.inc?'':'excl'}" tabindex="0" data-i="${i}" aria-expanded="false">
        <td class="mono"><span class="caret">›</span>${esc(r.id)}</td>
        <td>${esc(r.colab)}${r.flag?`<span class="flag">${esc(r.flag)}</span>`:''}</td>
        ${ex?`<td>${esc(r.extra)}</td>`:''}
        ${OF.map(o=>`<td class="c">${r[o.k]?`<span class="yes" role="img" aria-label="Sim"></span>`:`<span class="no" role="img" aria-label="Não"></span>`}</td>`).join('')}
        <td>${statusChip(r)}</td>
      </tr>
      <tr class="det" hidden><td colspan="${8+(ex?1:0)}"><p><b>O que aconteceu:</b> ${esc(r.obs)}</p>${r.imp?`<p><b>Impacto:</b> ${esc(r.imp)}</p>`:''}${r.res?`<p><b>Resultado:</b> ${esc(r.res)}</p>`:''}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="legend-note"><span><span class="yes" style="width:10px;height:10px;margin-right:6px;vertical-align:-1px"></span>ponto de perda presente</span><span><span class="no" style="margin-right:6px"></span>não identificado</span><span>Clique em uma linha para ver o que aconteceu.</span></div>`;
}
function colabTable(t){
  const m = {};
  t.rows.filter(r=>r.inc).forEach(r=>{
    const k=r.colab; m[k]=m[k]||{n:0,c:{}}; m[k].n++;
    OF.forEach(o=>{m[k].c[o.k]=(m[k].c[o.k]||0)+(r[o.k]?1:0)});
  });
  const list = Object.entries(m).sort((a,b)=>{
    const s=x=>OF.reduce((z,o)=>z+(o.k==='sla'?0:x[1].c[o.k]),0)/x[1].n; return s(b)-s(a)||b[1].n-a[1].n});
  return `<div class="tbl-wrap"><table class="heat">
   <thead><tr><th>Colaborador</th><th class="c">Atend.</th>${OF.map(o=>`<th class="c">${esc(o.curto)}</th>`).join('')}</tr></thead>
   <tbody>${list.map(([k,v])=>`<tr><td class="fila">${esc(k)}</td><td class="c mono">${v.n}</td>${OF.map(o=>heatCell(v.c[o.k]/v.n, v.c[o.k]?`${v.c[o.k]}/${v.n}`:'—')).join('')}</tr>`).join('')}</tbody></table></div>
   <p class="hint" style="margin-top:10px">Ordenado por quem concentra mais pontos comerciais (sem contar SLA). Com amostras pequenas, use para orientar o feedback, não para ranquear.</p>`;
}
function heatCell(p, label){
  const a = p? (0.12 + p*0.78) : 0;
  const fg = a>0.5 ? '#fff' : 'var(--ink)';
  return `<td class="h c" style="background:rgba(var(--heat),${a.toFixed(2)});color:${fg}">${label}</td>`;
}
function cases(t){
  const good = t.rows.filter(r=>r.st==='convertido'||r.st==='benchmark');
  const bad = t.rows.filter(r=>r.inc && (r.st==='perda'||r.st==='recusa'))
    .map(r=>({r,s:OF.reduce((z,o)=>z+(r[o.k]?(o.k==='sla'?0.5:1):0),0)})).sort((a,b)=>b.s-a.s).slice(0,3).map(x=>x.r);
  const card = (r,ok)=>`<div class="case"><div class="h"><span class="mono">${esc(r.id)}</span>${statusChip(r)}</div><div class="who">${esc(r.colab)}${r.extra&&t.extraCol?` · <span style="font-weight:400;color:var(--muted)">${esc(r.extra)}</span>`:''}</div><p>${esc(r.obs)}</p>${!ok?`<p style="color:var(--muted);font-size:12px">${OF.filter(o=>r[o.k]).map(o=>o.curto).join(' · ')}</p>`:''}</div>`;
  return `${bad.length?`<div><h2>Casos que mais ensinam</h2><p class="hint">Atendimentos com mais pontos de perda ao mesmo tempo. Bons exemplos para feedback individual.</p><div class="cases">${bad.map(r=>card(r,false)).join('')}</div></div>`:''}
  ${good.length?`<div><h2>O que deu certo</h2><p class="hint">Atendimentos que converteram ou mostram a condução esperada. Use como modelo.</p><div class="cases">${good.map(r=>card(r,true)).join('')}</div></div>`:''}`;
}
function compare(t){
  const c=t.comparativo;
  const rows = OF.map(o=>({o, a:c.vals[o.k], b:t.pct[o.k]}));
  return `<div class="card"><h2>Comparativo: ${esc(c.label)} × hoje</h2>
  <p class="hint">${esc(c.label)}: ${c.base} atendimentos · hoje: ${t.n} atendimentos. Aqui, quanto menor, melhor: queda em verde, alta em vermelho.</p>
  <div class="cmp">${rows.map(({o,a,b})=>{
    const d = a==null?null:(b-a)*100;
    const cls = d==null?'na':(d>0.05?'up':(d<-0.05?'down':'na'));
    return `<div class="cmp-row"><div class="lbl" style="font-weight:600;font-size:13.5px">${esc(o.nome)}</div>
      <div class="cmp-bars">
        <div style="display:grid;grid-template-columns:minmax(0,1fr) 48px;gap:8px;align-items:center"><div class="track"><div class="fill ctx" style="width:${(a??0)*100}%"></div></div><span style="font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums">${a==null?'s/ dado':pct(a)}</span></div>
        <div style="display:grid;grid-template-columns:minmax(0,1fr) 48px;gap:8px;align-items:center"><div class="track"><div class="fill" style="width:${b*100}%"></div></div><span style="font-size:12px;font-weight:600;font-variant-numeric:tabular-nums">${pct(b)}</span></div>
      </div>
      <div class="delta ${cls}">${d==null?'sem base':(d>0?'+':'')+d.toLocaleString('pt-BR',{maximumFractionDigits:1})+' p.p.'}</div></div>`}).join('')}</div>
  <div class="legend-note"><span><i style="background:var(--bar-weak)"></i>${esc(c.label)}</span><span><i style="background:var(--primary)"></i>Hoje (05/10)</span></div></div>`;
}
function porFila(t){
  const filas = [...new Set(t.rows.map(r=>r.extra))];
  const txt = {
    'Eugênia':'Cliente traz necessidade específica (ex.: hemodiálise, cirurgia reparadora) e a retomada não usa essa informação para recomendar o produto.',
    'Eugênia Cotação':'Cliente sinaliza que quer seguir ou volta com uma dúvida objetiva, e a jornada perde força por demora e retomada genérica.',
    'Eugênia Seller':'Cenário mais crítico: clientes escolhendo produto, pedindo atendente e enviando documentos perdem ritmo na passagem do robô para o humano.'};
  return `<div class="card"><h2>Comparação entre as três filas</h2><p class="hint">Percentual de atendimentos de cada fila com o ponto de perda. Cor mais forte = mais frequente.</p>
  <div class="tbl-wrap"><table class="heat"><thead><tr><th>Fila</th><th class="c">Atend.</th>${OF.map(o=>`<th class="c">${esc(o.curto)}</th>`).join('')}</tr></thead><tbody>
  ${filas.map(f=>{const rs=t.rows.filter(r=>r.extra===f);return `<tr><td class="fila">${esc(f)}</td><td class="c mono">${rs.length}</td>${OF.map(o=>{const c=rs.filter(r=>r[o.k]).length;return heatCell(c/rs.length, `${pct(c/rs.length,0)}`)}).join('')}</tr>`}).join('')}
  </tbody></table></div>
  <div style="display:grid;gap:10px;margin-top:16px">${filas.map(f=>`<p style="margin:0;color:var(--ink-2)"><b style="color:var(--ink)">${esc(f)}:</b> ${esc(txt[f]||'')}</p>`).join('')}</div></div>`;
}
function composicao(t){
  const groups = [
    {l:'Erro na lista de contatos', n:t.rows.filter(r=>!r.inc).length, c:'#79859a'},
    {l:'Recusa explícita', n:t.rows.filter(r=>r.st==='recusa').length, c:'#c93600'},
    {l:'Voltou a ser cliente', n:t.rows.filter(r=>r.st==='convertido').length, c:'#157a3c'}];
  const robo = t.rows.filter(r=>r.colab==='Sem atendimento humano').length;
  return `<div class="card"><h2>O que havia na lista de ${t.total} contatos</h2><p class="hint">Antes de avaliar a abordagem, é preciso saber se o contato era mesmo um ex-cliente com chance de voltar.</p>
  <div class="stack">${groups.map(g=>`<div style="flex:${g.n};background:${g.c}" title="${g.l}: ${g.n}">${g.n}</div>`).join('')}</div>
  <div class="legend-note" style="margin-top:12px">${groups.map(g=>`<span><i style="background:${g.c}"></i>${g.l}: <b style="color:var(--ink)">${g.n}</b> (${pct(g.n/t.total,0)})</span>`).join('')}</div>
  <p style="margin:14px 0 0;color:var(--ink-2)">Erros encontrados: spam com links suspeitos, conversa sem nenhuma mensagem, cliente com plano ativo há mais de 6 anos e pessoa que não pediu contato e ameaçou processo. Além disso, <b style="color:var(--ink)">${robo} das recusas foram encerradas pelo robô</b>, sem nenhum atendimento humano.</p></div>`;
}

function tabPage(t){
  return `<section class="page">
    <div><div class="eyebrow">Fila analisada</div><h1>${esc(t.titulo)}</h1><p class="sub">${esc(t.oque)}</p></div>
    ${kpis(t)}
    <div class="resumo"><div class="eyebrow">Em resumo</div><p>${esc(t.resumo)}</p>${t.principalNota?`<p style="font-size:13px;color:var(--ink-2)">${esc(t.principalNota)}</p>`:''}</div>
    ${t.composicao?composicao(t):''}
    <div class="two">
      <div class="card"><h2>Onde estamos perdendo vendas</h2><p class="hint">Percentual dos ${t.n} atendimentos em que cada ponto apareceu. Um atendimento pode ter mais de um, por isso a soma passa de 100%.</p>${bars(t)}</div>
      <div class="card"><h2>O que fazer agora</h2><p class="hint">Plano de ação, em ordem de prioridade.</p><ol class="acoes">${t.plano.map(p=>`<li>${esc(p)}</li>`).join('')}</ol></div>
    </div>
    ${t.porFila?porFila(t):''}
    ${t.comparativo?compare(t):''}
    ${cases(t)}
    <div class="card"><h2>Atendimento a atendimento</h2><p class="hint">Cada linha é um atendimento monitorado. O ponto vermelho mostra onde ele perdeu força.</p>${table(t)}</div>
    <div class="card"><h2>Por colaborador</h2><p class="hint">Quantos atendimentos de cada pessoa tiveram cada ponto de perda.</p>${colabTable(t)}</div>
  </section>`;
}

function overview(){
  const tot = TABS.reduce((s,t)=>s+t.total,0), val = TABS.reduce((s,t)=>s+t.n,0), conv = TABS.reduce((s,t)=>s+t.conv,0);
  const agg = {}; OF.forEach(o=>agg[o.k]=TABS.reduce((s,t)=>s+t.cnt[o.k],0)/val);
  const topAgg = OF.filter(o=>o.k!=='sla').sort((a,b)=>agg[b.k]-agg[a.k])[0];
  return `<section class="page">
    <div><div class="eyebrow">Visão geral · 8 filas</div><h1>Por que não estamos vendendo?</h1><p class="sub">Resumo das monitorias comerciais de todas as filas. Cada aba acima traz o detalhe de uma fila, com os atendimentos, os colaboradores e o plano de ação.</p></div>
    <div class="kpis">
      <div class="kpi"><div class="eyebrow">Atendimentos monitorados</div><div class="v">${tot}</div><div class="d">${val} com oportunidade real de venda</div></div>
      <div class="kpi"><div class="eyebrow">Ponto de perda mais comum</div><div class="t">${topAgg.nome}</div><div class="d">${pct(agg[topAgg.k])} dos atendimentos válidos</div></div>
      <div class="kpi"><div class="eyebrow">Demora (SLA)</div><div class="v">${pct(agg.sla)}</div><div class="d">dos atendimentos válidos tiveram atraso</div></div>
      <div class="kpi"><div class="eyebrow">Vendas observadas</div><div class="v">${conv}</div><div class="d">casos usados como modelo de boa condução</div></div>
    </div>
    <div class="resumo"><div class="eyebrow">Em resumo</div><p>Em quase todas as filas o cliente chega interessado. A venda se perde depois da cotação: a retomada é genérica, o promotor envia opções sem recomendar uma e a objeção do cliente (preço, carência, coparticipação) não vira negociação. A demora agrava tudo isso, principalmente na passagem do robô para o atendente.</p></div>
    <div class="card"><h2>Mapa de ofensores por fila</h2><p class="hint">Percentual de atendimentos válidos de cada fila com o ponto de perda. Cor mais forte = mais frequente. Clique em uma fila para abrir a aba.</p>
      <div class="tbl-wrap"><table class="heat"><thead><tr><th>Fila</th><th class="c">Válidos</th>${OF.map(o=>`<th class="c" title="${esc(o.nome)}">${esc(o.curto)}</th>`).join('')}<th>Principal ponto comercial</th></tr></thead><tbody>
      ${TABS.map(t=>`<tr class="click" data-go="${t.id}" tabindex="0"><td class="fila">${esc(t.nome)}</td><td class="c mono">${t.n}</td>${OF.map(o=>heatCell(t.pct[o.k], pct(t.pct[o.k],0))).join('')}<td style="white-space:nowrap">${t.top.length>1?'Empate: '+t.top.map(o=>o.curto).join(', '):esc(t.top[0].nome)}</td></tr>`).join('')}
      </tbody></table></div></div>
    <div class="card"><h2>Os cinco pontos avaliados</h2><p class="hint">Todas as filas foram monitoradas com os mesmos critérios. Como nas planilhas, o SLA é tratado como contexto operacional e mostrado à parte.</p>
      <div class="gloss">${OF.map(o=>`<div><b>${esc(o.nome)}</b><span>${esc(o.desc)}</span></div>`).join('')}</div></div>
    <div class="card"><h2>O que vale para todas as filas</h2><ol class="acoes">
        <li>Ler o histórico antes de falar com o cliente: necessidade, opções já enviadas e última objeção.</li>
        <li>Toda cotação termina com uma recomendação clara e o motivo dela.</li>
        <li>Follow-up sempre retoma a última dúvida ou barreira do cliente.</li>
        <li>Objeção de preço gera a pergunta "quanto cabe no seu orçamento?" e uma alternativa.</li>
        <li>Prioridade de resposta para quem já disse que quer seguir, pediu atendente ou enviou documentos.</li>
        <li>Separar suporte, cancelamento e erros de lista da análise de vendas.</li></ol></div>
    <p class="foot">Amostras pequenas (3 a 22 atendimentos por fila): leia os percentuais como sinais para orientar coaching, não como taxas definitivas da operação. Um atendimento pode ter mais de um ponto de perda.</p>
  </section>`;
}

// ---- tabs
const ALL = [{id:'geral', nome:'Visão geral'}, ...TABS];
const nav = document.getElementById('tabs'), main = document.getElementById('main');
nav.innerHTML = ALL.map(t=>`<button class="tab" role="tab" id="tab-${t.id}" data-id="${t.id}" aria-selected="false">${esc(t.nome)}${t.id!=='geral'&&t.ajustes&&t.ajustes.length?'':''}</button>`).join('');
function show(id, push){
  if(!ALL.find(t=>t.id===id)) id='geral';
  nav.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected', b.dataset.id===id));
  main.innerHTML = id==='geral' ? overview() : tabPage(TABS.find(t=>t.id===id));
  main.setAttribute('aria-labelledby','tab-'+id);
  if(push){ try{ history.replaceState(null,'','#'+id);}catch(e){} try{localStorage.setItem('mc-tab',id)}catch(e){} window.scrollTo({top:0}); }
  const btn = document.getElementById('tab-'+id); btn && btn.scrollIntoView({block:'nearest',inline:'nearest'});
}
nav.addEventListener('click', e=>{const b=e.target.closest('.tab'); if(b) show(b.dataset.id,true)});
nav.addEventListener('keydown', e=>{
  if(!['ArrowRight','ArrowLeft'].includes(e.key)) return;
  const btns=[...nav.querySelectorAll('.tab')]; const i=btns.indexOf(document.activeElement); if(i<0) return;
  const n=btns[(i+(e.key==='ArrowRight'?1:-1)+btns.length)%btns.length]; n.focus(); show(n.dataset.id,true);
});
main.addEventListener('click', e=>{
  const go = e.target.closest('[data-go]'); if(go){show(go.dataset.go,true);return}
  const tr = e.target.closest('tr.main'); if(tr){const d=tr.nextElementSibling; d.hidden=!d.hidden; tr.classList.toggle('open',!d.hidden); tr.setAttribute('aria-expanded',!d.hidden)}
});
main.addEventListener('keydown', e=>{ if(e.key!=='Enter'&&e.key!==' ') return; const t=e.target.closest('tr.main,[data-go]'); if(t){e.preventDefault(); t.click();} });
let start = (location.hash||'').slice(1);
if(!start){ try{ start = localStorage.getItem('mc-tab')||''; }catch(e){} }
show(start||'geral', false);
</script>

</body>
</html>
